<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard & Analytics 📊</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0c0d10; 
            background-image: 
                radial-gradient(at 10% 10%, rgba(255, 215, 0, 0.05) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(255, 215, 0, 0.05) 0px, transparent 50%);
            min-height: 100vh;
            color: #ffffff;
            padding: 40px 20px;
            display: block;
        }

        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo-container img {
            max-width: 180px;
            height: auto;
            border: none;
            outline: none;
        }

        header, .stat-card, .link-item, .chart-card {
            background: rgba(20, 21, 25, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            border-radius: 24px;
        }

        header {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-profile {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-profile i {
            background: linear-gradient(135deg, #ffd700 0%, #b89b00 100%);
            color: #000;
            padding: 14px;
            border-radius: 50%;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }

        .header-info h1 {
            color: #ffd700;
            font-size: 22px;
            font-weight: 800;
            text-shadow: 0px 2px 10px rgba(255, 215, 0, 0.1);
        }

        .header-info p {
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 500;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrapper i {
            position: absolute;
            left: 14px;
            color: #ffd700;
            font-size: 14px;
        }

        select, input, textarea {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        input { padding-left: 40px; width: 200px; }
        input::placeholder, textarea::placeholder { color: #606060; }
        input:focus, select:focus, textarea:focus { background: rgba(255, 255, 255, 0.05); border-color: #ffd700; box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1); }

        select {
            cursor: pointer;
            padding-right: 32px;
            padding-left: 14px;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23ffd700' stroke-width='2.5'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 12px;
        }

        select option { background-color: #1a1c23; color: #ffffff; }

        /* Stats Enhancements */
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.04) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .stat-card > * { position: relative; z-index: 1; }

        .stat-card h3 {
            font-size: 13px;
            font-weight: 700;
            color: #a0a0a0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-card h3 i { color: #ffd700; font-size: 14px; }
        .stat-card:nth-child(2) h3 i { color: #4ade80; }
        .stat-card:nth-child(3) h3 i { color: #60a5fa; }

        .stat-card .value {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* Chart Styling */
        .chart-card { padding: 24px; margin-bottom: 30px; }
        .chart-header { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: #ffd700; margin-bottom: 20px; }

        .or-divider { text-align: center; margin: 30px 0; position: relative; }
        .or-divider::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(255, 255, 255, 0.1); z-index: 1; }
        .or-divider span { background: rgba(20, 21, 25, 0.9); padding: 6px 16px; border-radius: 12px; font-size: 12px; font-weight: 800; color: #ffd700; position: relative; z-index: 2; border: 1px solid rgba(255, 215, 0, 0.2); }

        .links-list { display: flex; flex-direction: column; gap: 16px; }
        .link-item { border-radius: 20px; overflow: hidden; transition: all 0.3s ease; }
        .link-item:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 215, 0, 0.3); transform: translateY(-2px); }
        .link-header { padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .link-info { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow: hidden; }
        
        .link-slug {
            font-size: 18px;
            font-weight: 800;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Copy Quick Button */
        .copy-short-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .copy-short-btn:hover { background: #ffd700; color: #000; transform: scale(1.05); }

        .link-url { font-size: 13px; color: #a0a0a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; font-weight: 500; }
        .link-meta { display: flex; align-items: center; gap: 14px; }
        .success-badge { padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(74, 222, 128, 0.3); background: rgba(20, 253, 70, 0.05); color: #4ade80; }
        .toggle-icon { font-size: 12px; color: #ffd700; transition: transform 0.35s ease, background 0.3s ease; background: rgba(255, 255, 255, 0.05); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.1); }
        .link-item.open .toggle-icon { transform: rotate(180deg); color: #000; background: #ffd700; border-color: #ffd700; }
        
        .link-details { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s cubic-bezier(0.16, 1, 0.3, 1); background: rgba(0, 0, 0, 0.2); border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .link-item.open .link-details { grid-template-rows: 1fr; }
        .details-wrapper { overflow: hidden; }
        .edit-box { padding: 24px; }
        .edit-box h4 { font-size: 14px; font-weight: 800; color: #ffd700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .edit-input-group { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .edit-content-input { width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 215, 0, 0.2); padding: 14px; color: #fff; resize: vertical; min-height: 80px; font-family: monospace; border-radius: 12px; }
        .edit-content-input:focus { background: rgba(0, 0, 0, 0.5); border-color: #ffd700; }
        
        .action-buttons { display: flex; gap: 10px; justify-content: flex-end; }
        .save-btn, .delete-btn { border: none; padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
        .save-btn { background: linear-gradient(135deg, #ffd700 0%, #b89b00 100%); color: #000; box-shadow: 0 4px 12px rgba(255, 215, 0, 0.15); }
        .save-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(255, 215, 0, 0.25); background: linear-gradient(135deg, #ffea00 0%, #c9a900 100%); }
        .delete-btn { background: linear-gradient(135deg, #ff4d4d 0%, #cc0000 100%); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }
        .delete-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(239, 68, 68, 0.3); background: linear-gradient(135deg, #ff6666 0%, #e60000 100%); }
        .no-data { text-align: center; color: #a0a0a0; padding: 30px; font-size: 14px; font-weight: 600; }

        @media (max-width: 768px) {
            body { padding: 20px 12px; }
            header { flex-direction: column; align-items: stretch; gap: 16px; }
            .controls { flex-direction: column; align-items: stretch; }
            .search-wrapper, input, select { width: 100%; }
            .link-header { flex-direction: column; align-items: flex-start; gap: 14px; }
            .link-meta { width: 100%; justify-content: space-between; }
            .action-buttons { width: 100%; flex-direction: column; }
            .save-btn, .delete-btn { padding: 14px; justify-content: center; flex: 1; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <div class="logo-container">
            <img src="/logo.png" alt="Website Logo">
        </div>

        <header>
            <div class="header-profile">
                <i class="fa-solid fa-gear"></i>
                <div class="header-info">
                    <h1>Dashboard & Analytics</h1>
                    <p>Manage and track content performance</p>
                </div>
            </div>
            <div class="controls">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search ID or content..." oninput="renderDashboard()">
                </div>
                <select id="sortSelect" onchange="renderDashboard()">
                    <option value="tasks-desc">Highest Completions 🔥</option>
                    <option value="tasks-asc">Lowest Completions ❄️</option>
                    <option value="date-desc">Newest Created 🕒</option>
                </select>
            </div>
        </header>

        <!-- Enhanced Stats Overview -->
        <div class="stats-overview">
            <div class="stat-card">
                <h3><i class="fa-solid fa-link"></i> Total Links</h3>
                <div class="value" id="totalLinks">0</div>
            </div>
            <div class="stat-card">
                <h3><i class="fa-solid fa-square-check"></i> Total Completed</h3>
                <div class="value" id="totalCompleted" style="color: #4ade80">0</div>
            </div>
            <div class="stat-card">
                <h3><i class="fa-solid fa-chart-pie"></i> Avg. Completions / Link</h3>
                <div class="value" id="avgCompleted" style="color: #60a5fa">0</div>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-header">
                <i class="fa-solid fa-chart-line"></i> Top Performing Links
            </div>
            <canvas id="performanceChart" height="100"></canvas>
        </div>

        <div class="or-divider">
            <span>Manage & Edit Content</span>
        </div>

        <div class="links-list" id="linksList">
            <!-- Cards will be generated here -->
        </div>
    </div>

    <script>
        let mockData = []; 
        let myChart = null;

        async function fetchAnalytics() {
            try {
                const response = await fetch('/api/analytics'); 
                const data = await response.json();
                if(data.success) {
                    mockData = data.links; 
                    renderDashboard();     
                }
            } catch (err) {
                console.error("Failed to fetch data:", err);
            }
        }

        function calculateOverview(links) {
            const totalLinks = links.length;
            document.getElementById('totalLinks').innerText = totalLinks;
            
            const totalCompleted = links.reduce((sum, link) => sum + (link.completedTasksCount || 0), 0);
            document.getElementById('totalCompleted').innerText = totalCompleted;

            const avg = totalLinks > 0 ? (totalCompleted / totalLinks).toFixed(1) : 0;
            document.getElementById('avgCompleted').innerText = avg;
        }

        // Updated Chart Function (Gradient & Curved Edges)
        function updateChart(links) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            
            const topLinks = [...links].sort((a,b) => (b.completedTasksCount || 0) - (a.completedTasksCount || 0)).slice(0, 7);
            const labels = topLinks.map(l => '/' + l.id);
            const dataCounts = topLinks.map(l => l.completedTasksCount || 0);

            if (myChart) { myChart.destroy(); }

            // Create beautiful gradient
            let gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 215, 0, 0.05)');

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Completed Tasks',
                        data: dataCounts,
                        backgroundColor: gradient,
                        borderColor: '#ffd700',
                        borderWidth: 1.5,
                        borderRadius: 8,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { 
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(0,0,0,0.8)', titleColor: '#ffd700', padding: 12, cornerRadius: 8 }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false }, ticks: { color: '#a0a0a0', stepSize: 1 } },
                        x: { grid: { display: false, drawBorder: false }, ticks: { color: '#a0a0a0' } }
                    }
                }
            });
        }

        function toggleLinkDetails(element) {
            const item = element.parentElement;
            item.classList.toggle('open');
        }

        // Function to copy link dynamically
        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = btnElement.innerHTML;
                btnElement.innerHTML = '<i class="fa-solid fa-check"></i>';
                btnElement.style.background = '#4ade80';
                btnElement.style.color = '#000';
                setTimeout(() => {
                    btnElement.innerHTML = originalHtml;
                    btnElement.style.background = '';
                    btnElement.style.color = '';
                }, 2000);
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        async function updateLink(id, inputId) {
            const newContent = document.getElementById(inputId).value;
            if(!newContent.trim()) return alert("Please enter valid URL or text content!");

            try {
                const response = await fetch('/api/analytics', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, url: newContent })
                });
                
                const result = await response.json();
                if(result.success) {
                    alert("Content updated successfully! 🎉");
                    fetchAnalytics(); 
                } else {
                    alert("Update failed: " + result.message);
                }
            } catch (err) {
                console.error("Error updating content:", err);
                alert("Update request sent successfully (Ensure your backend supports the PUT method).");
            }
        }

        async function deleteLink(id) {
            if(!confirm("Are you sure you want to permanently delete this content from the database? ⚠️")) return;

            try {
                const response = await fetch('/api/analytics', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });

                const result = await response.json();
                if(result.success) {
                    alert("Content deleted successfully! 🗑️");
                    fetchAnalytics(); 
                } else {
                    alert("Deletion failed: " + result.message);
                }
            } catch (err) {
                console.error("Error deleting content:", err);
                alert("Delete request sent successfully (Ensure your backend supports the DELETE method).");
                fetchAnalytics();
            }
        }

        function renderDashboard() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const sortMethod = document.getElementById('sortSelect').value;
            const container = document.getElementById('linksList');
            
            container.innerHTML = "";

            let filteredLinks = mockData.filter(link => {
                return (link.id && link.id.toLowerCase().includes(searchInput)) || 
                       (link.url && link.url.toLowerCase().includes(searchInput));
            });

            if (sortMethod === 'tasks-desc') {
                filteredLinks.sort((a, b) => (b.completedTasksCount || 0) - (a.completedTasksCount || 0));
            } else if (sortMethod === 'tasks-asc') {
                filteredLinks.sort((a, b) => (a.completedTasksCount || 0) - (b.completedTasksCount || 0));
            } else if (sortMethod === 'date-desc') {
                filteredLinks.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            }

            calculateOverview(filteredLinks);
            updateChart(filteredLinks); 

            if (filteredLinks.length === 0) {
                container.innerHTML = '<div class="no-data"><i class="fa-regular fa-folder-open"></i> No content found.</div>';
                return;
            }

            filteredLinks.forEach(link => {
                const inputId = `input-${link.id}`;
                const safeContent = escapeHTML(link.url || "");
                const currentDomain = window.location.origin;
                const shareableLink = `${currentDomain}/?id=${link.id}`;
                
                const linkItem = document.createElement('div');
                linkItem.className = 'link-item';
                linkItem.innerHTML = `
                    <div class="link-header" onclick="toggleLinkDetails(this)">
                        <div class="link-info">
                            <div class="link-slug">
                                <i class="fa-solid fa-lock" style="font-size: 14px;"></i> /${link.id}
                                <button class="copy-short-btn" onclick="event.stopPropagation(); copyToClipboard('${shareableLink}', this)" title="Copy Shareable Link">
                                    <i class="fa-solid fa-copy"></i>
                                </button>
                            </div>
                            <div class="link-url">${safeContent}</div>
                        </div>
                        <div class="link-meta">
                            <span class="success-badge"><i class="fa-solid fa-circle-check"></i> ${link.completedTasksCount || 0} Completed</span>
                            <span class="toggle-icon"><i class="fa-solid fa-chevron-down"></i></span>
                        </div>
                    </div>
                    <div class="link-details">
                        <div class="details-wrapper">
                            <div class="edit-box">
                                <h4><i class="fa-solid fa-pen-to-square"></i> Edit Original Content (URL/Script):</h4>
                                <div class="edit-input-group">
                                    <textarea id="${inputId}" class="edit-content-input" placeholder="Paste your URL or code script here...">${safeContent}</textarea>
                                    <div class="action-buttons">
                                        <button class="save-btn" onclick="updateLink('${link.id}', '${inputId}')">
                                            <i class="fa-solid fa-floppy-disk"></i> Save Changes
                                        </button>
                                        <button class="delete-btn" onclick="deleteLink('${link.id}')">
                                            <i class="fa-solid fa-trash-can"></i> Delete Content
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(linkItem);
            });
        }

        window.onload = fetchAnalytics;
    </script>
</body>
</html>

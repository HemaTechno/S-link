<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Locker & Link Shortener</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #ffd700; --bg-dark: #0c0d10; --glass-bg: rgba(20, 21, 25, 0.7); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        
        .wrapper { display: flex; gap: 20px; max-width: 1100px; width: 100%; flex-wrap: wrap; }
        .container { flex: 1; min-width: 320px; padding: 30px; border-radius: 24px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .preview-container { flex: 1; min-width: 320px; padding: 30px; border-radius: 24px; background: rgba(15, 16, 20, 0.9); border: 1px dashed var(--primary); display: flex; flex-direction: column; gap: 15px; }

        h1, h2 { color: var(--primary); font-size: 1.5rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; right: 15px; top: 18px; color: var(--primary); }
        
        input, select, textarea {
            width: 100%; padding: 14px 45px 14px 15px; background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; outline: none; font-size: 14px;
        }
        textarea { resize: vertical; min-height: 80px; }
        
        .section-title { font-size: 14px; color: var(--primary); font-weight: bold; margin: 15px 0 8px; }
        .task-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .task-row select, .task-row input { padding: 10px; font-size: 12px; }
        .btn-add { background: rgba(255,215,0,0.2); color: var(--primary); border: 1px solid var(--primary); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }

        .main-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #ffd700 0%, #b89b00 100%);
            color: #000; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 800; margin-top: 15px;
        }

        /* Preview Styles */
        .preview-card { background: rgba(255, 255, 255, 0.03); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .preview-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; display: none; margin-bottom: 10px; }
        .preview-task { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-top: 5px; display: flex; justify-content: space-between; }
        
        /* Auto Fetch Button */
        .btn-fetch { position: absolute; left: 8px; top: 8px; background: var(--primary); color: #000; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
    </style>
</head>

<body>

<div class="wrapper">
    <!-- Form Section -->
    <div class="container">
        <h1><i class="fa-solid fa-wand-magic-sparkles"></i> Create Content Locker</h1>
        
        <!-- 1. Media Source & Auto Fetch -->
        <div class="section-title">1. Media & Auto Fill (YouTube URL)</div>
        <div class="input-group">
            <input id="mediaUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." oninput="updatePreview()">
            <button type="button" class="btn-fetch" onclick="fetchYoutubeData()">Auto Fetch</button>
            <i class="fa-solid fa-play"></i>
        </div>

        <!-- 2. Basic Info -->
        <div class="section-title">2. Title & Description</div>
        <div class="input-group">
            <input id="title" type="text" placeholder="Title (e.g., Download Mod Pack)" oninput="updatePreview()">
            <i class="fa-solid fa-heading"></i>
        </div>
        <div class="input-group">
            <textarea id="description" placeholder="Description (Optional)" oninput="updatePreview()"></textarea>
            <i class="fa-solid fa-align-left"></i>
        </div>

        <!-- Target Destination -->
        <div class="section-title">3. Destination Content (URL or Text)</div>
        <div class="input-group">
            <input id="targetUrl" type="text" placeholder="Locked URL or Hidden Text">
            <i class="fa-solid fa-lock"></i>
        </div>

        <!-- 4. Dynamic Tasks -->
        <div class="section-title">4. Tasks Configuration</div>
        <div id="tasksList"></div>
        <button type="button" class="btn-add" onclick="addTaskRow()"><i class="fa-solid fa-plus"></i> Add Task</button>

        <!-- 5. Monetization -->
        <div class="section-title">5. Profit Network</div>
        <div class="input-group">
            <select id="monetization">
                <option value="lootlabs">LootLabs</option>
                <option value="linkvertise">Linkvertise</option>
                <option value="nitrolink">Nitro-Link</option>
                <option value="just">Just Direct Access (No Ads)</option>
            </select>
            <i class="fa-solid fa-coins"></i>
        </div>

        <button id="shortBtn" class="main-btn" onclick="processLock()"><i class="fa-solid fa-link"></i> Create Link</button>
    </div>

    <!-- Live Preview Section -->
    <div class="preview-container">
        <h2><i class="fa-solid fa-eye"></i> Live Page Preview</h2>
        <div class="preview-card">
            <img id="prevImg" class="preview-img" src="" alt="Thumbnail">
            <h3 id="prevTitle" style="color: var(--primary); font-size: 16px;">Title Preview</h3>
            <p id="prevDesc" style="color: #aaa; font-size: 13px; margin-top: 5px;">Description preview will show here...</p>
        </div>
        <div class="section-title">Required Tasks Preview:</div>
        <div id="prevTasks"></div>
    </div>
</div>

<script src="link.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <script data-cfasync="false" src="//dcbbwymp1bhlf.cloudfront.net/?wbbcd=1444225"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Content Locker & Link Shortener</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0c0d10; 
            background-image: 
                radial-gradient(at 10% 10%, rgba(255, 215, 0, 0.05) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(255, 215, 0, 0.05) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 480px;
            max-width: 100%;
            padding: 30px 35px 45px;
            border-radius: 28px;
            background: rgba(20, 21, 25, 0.6);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-3px);
            box-shadow: 0 30px 60px rgba(255, 215, 0, 0.05);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 180px;
            height: auto;
            display: inline-block;
        }

        h1 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 12px;
            font-size: 2.1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0px 2px 10px rgba(255, 215, 0, 0.2);
        }

        .desc {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 25px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Toggle Switch for URL / Text */
        .type-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .type-toggle button {
            flex: 1;
            padding: 10px;
            background: transparent;
            color: #a0a0a0;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: none;
        }

        .type-toggle button.active {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.1);
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
        }

        .input-group i {
            position: absolute;
            right: 18px;
            color: #ffd700;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* For textarea icon */
        .align-top-icon {
            top: 18px;
        }

        input, select, textarea {
            width: 100%;
            padding: 15px 48px 15px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }

        input::placeholder, textarea::placeholder {
            color: #606060;
            font-weight: 500;
        }

        input:focus, select:focus, textarea:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1), 0 5px 15px rgba(255, 215, 0, 0.05);
        }

        input:focus + i, textarea:focus + i {
            transform: scale(1.1);
            color: #ffea00;
        }

        .advanced-settings {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 18px;
            padding: 20px 16px 6px 16px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            justify-content: space-between;
        }

        .setting-item {
            flex: 1;
            text-align: left;
            position: relative;
        }

        .advanced-settings label {
            display: flex;
            margin-bottom: 8px;
            font-size: 12.5px;
            font-weight: 800;
            color: #ffd700;
            align-items: center;
            gap: 6px;
        }

        .advanced-settings select {
            padding: 12px 32px 12px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23ffd700' stroke-width='2.5'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 12px;
        }

        .advanced-settings select option {
            background-color: #1a1c23;
            color: #ffffff;
        }

        .main-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ffd700 0%, #b89b00 100%);
            color: #000;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.25);
            background: linear-gradient(135deg, #ffea00 0%, #c9a900 100%);
        }

        .main-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: #606060;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #loading {
            margin-top: 20px;
            text-align: center;
            color: #ffd700;
            font-weight: 700;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.5; transform: scale(0.98); }
        }

        .result-box {
            margin-top: 28px;
            padding: 22px;
            border-radius: 18px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: slideUp 0.4s ease;
            display: none;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-box {
            background: rgba(20, 253, 70, 0.05);
            border-color: rgba(74, 222, 128, 0.3);
        }

        .success-box h3 {
            color: #4ade80;
            font-weight: 800;
            margin-bottom: 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .success-box input {
            background: rgba(0, 0, 0, 0.4);
            text-align: center;
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 14px;
            padding: 12px;
            border-color: rgba(255, 215, 0, 0.2);
        }

        .success-box .copy-btn {
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            padding: 12px;
            font-size: 14px;
            border-radius: 12px;
            width: 100%;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        .success-box .copy-btn:hover { background: #059669; }

        .error-box {
            background: rgba(254, 242, 242, 0.05);
            border-color: rgba(248, 113, 113, 0.3);
            color: #f87171;
            font-weight: 700;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container { padding: 35px 20px; }
            .advanced-settings { flex-direction: column; gap: 12px; padding-bottom: 16px; }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo-container">
            <img src="/logo.png" alt="Logo">
        </div>

        <h1><i class="fa-solid fa-wand-magic-sparkles"></i> Content Locker</h1>

        <p class="desc">
            Lock your URL or Text to generate a smart, monetized link.
        </p>

        <!-- Toggle Options -->
        <div class="type-toggle">
            <button id="btn-url" class="active" onclick="switchType('url')">URL Link</button>
            <button id="btn-text" onclick="switchType('text')">Hidden Text</button>
        </div>

        <!-- URL Input -->
        <div class="input-group" id="url-group">
            <input id="url" type="url" placeholder="https://example.com">
            <i class="fa-solid fa-link"></i>
        </div>

        <!-- Text Input (Hidden by default) -->
        <div class="input-group" id="text-group" style="display: none;">
            <textarea id="textContent" placeholder="Paste your text, code, or secret message here..."></textarea>
            <i class="fa-solid fa-align-left align-top-icon"></i>
        </div>

        <!-- Custom Alias -->
        <div class="input-group">
            <input id="slug" type="text" maxlength="30" placeholder="Custom Alias (Optional) e.g., my-file">
            <i class="fa-solid fa-signature"></i>
        </div>

        <!-- Advanced Settings -->
        <div class="advanced-settings">
            <div class="setting-item">
                <label for="tier"><i class="fa-solid fa-circle-dollar-to-slot"></i> Profit Tier:</label>
                <select id="tier">
                    <option value="1" selected>Tier 1 (Normal)</option>
                    <option value="2">Tier 2 (Medium)</option>
                    <option value="3">Tier 3 (High Profit)</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="tasks"><i class="fa-solid fa-list-check"></i> Required Tasks:</label>
                <select id="tasks">
                    <option value="1">1 Task</option>
                    <option value="2">2 Tasks</option>
                    <option value="3" selected>3 Tasks (Recommended)</option>
                    <option value="4">4 Tasks</option>
                </select>
            </div>
        </div>

        <!-- Main Button -->
        <button id="shortBtn" class="main-btn" onclick="processLock()">
             <i class="fa-solid fa-lock"></i> Lock Content Now
        </button>

        <div id="loading" style="display:none;">
            <i class="fa-solid fa-spinner fa-spin"></i> Generating your link...
        </div>

        <!-- Results -->
        <div id="successBox" class="result-box success-box">
            <h3><i class="fa-solid fa-circle-check"></i> Link Created Successfully!</h3>
            <input type="text" id="finalUrl" readonly>
            <button class="copy-btn" onclick="copyLink()">
                <i class="fa-solid fa-copy"></i> Copy Link
            </button>
        </div>

        <div id="errorBox" class="result-box error-box">
            <i class="fa-solid fa-triangle-exclamation"></i> <span id="errorMsg">Something went wrong</span>
        </div>

    </div>

    <!-- Script to handle UI logic and API Calls -->
    <script>
        let currentMode = 'url';

        function switchType(type) {
            currentMode = type;
            if (type === 'url') {
                document.getElementById('url-group').style.display = 'flex';
                document.getElementById('text-group').style.display = 'none';
                document.getElementById('btn-url').classList.add('active');
                document.getElementById('btn-text').classList.remove('active');
            } else {
                document.getElementById('url-group').style.display = 'none';
                document.getElementById('text-group').style.display = 'flex';
                document.getElementById('btn-text').classList.add('active');
                document.getElementById('btn-url').classList.remove('active');
            }
        }

        async function processLock() {
            const btn = document.getElementById('shortBtn');
            const loading = document.getElementById('loading');
            const successBox = document.getElementById('successBox');
            const errorBox = document.getElementById('errorBox');
            const errorMsg = document.getElementById('errorMsg');

            successBox.style.display = 'none';
            errorBox.style.display = 'none';

            // Get content based on selected mode
            let contentToLock = "";
            if (currentMode === 'url') {
                contentToLock = document.getElementById('url').value;
                if (!contentToLock) {
                    showError("Please enter a valid URL.");
                    return;
                }
            } else {
                contentToLock = document.getElementById('textContent').value;
                if (!contentToLock.trim()) {
                    showError("Please enter some text to lock.");
                    return;
                }
            }

            const slug = document.getElementById('slug').value;
            const tier = document.getElementById('tier').value;
            const tasks = document.getElementById('tasks').value;

            btn.disabled = true;
            loading.style.display = 'block';

            try {
                // CHANGE '/' to your backend URL if it's hosted elsewhere
                const response = await fetch('/api/link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: contentToLock, slug, tier, tasks })
                });

                const result = await response.json();
                loading.style.display = 'none';

                if (result.success) {
                    successBox.style.display = 'block';
                    document.getElementById('finalUrl').value = result.short;
                    document.getElementById('url').value = '';
                    document.getElementById('textContent').value = '';
                    document.getElementById('slug').value = '';
                } else {
                    showError(result.message || "Failed to create link.");
                }
            } catch (err) {
                loading.style.display = 'none';
                showError("Network error. Please try again.");
            } finally {
                btn.disabled = false;
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            document.getElementById('errorMsg').innerText = msg;
            errorBox.style.display = 'block';
        }

        function copyLink() {
            const copyText = document.getElementById("finalUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const copyBtn = document.querySelector('.success-box .copy-btn');
            copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
            copyBtn.style.background = '#059669';
            
            setTimeout(() => {
                copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy Link';
                copyBtn.style.background = '#10b981';
            }, 2000);
        }
    </script>
</body>
</html>

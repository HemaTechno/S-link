<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SubX Pro Dashboard 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #070709;
            --surface: #121316;
            --surface-hover: #1c1d22;
            --primary: #f59e0b; /* Gold/Amber */
            --primary-glow: rgba(245, 158, 11, 0.25);
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #f4f4f5;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --radius-lg: 18px;
            --radius-md: 12px;
            --transition: all 0.25s ease-in-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        /* ===== BACKGROUND GLOW ===== */
        .bg-glow {
            position: absolute; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.06) 0%, transparent 70%);
            top: -100px; right: -100px; z-index: 0; pointer-events: none;
        }

        /* ===== MOBILE HEADER & OVERLAY ===== */
        .mobile-header {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: rgba(18, 19, 22, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border); z-index: 40;
            padding: 0 20px; align-items: center; justify-content: space-between;
        }
        .mobile-brand { font-size: 20px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .mobile-brand i { color: var(--primary); }
        .menu-toggle { background: transparent; border: none; color: var(--text-main); font-size: 22px; cursor: pointer; }

        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 45;
        }
        .sidebar-overlay.active { display: block; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 270px; background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 30px 20px;
            z-index: 50; transition: var(--transition); flex-shrink: 0;
        }
        
        .brand {
            font-size: 24px; font-weight: 800; color: var(--text-main);
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 35px; padding-left: 10px;
        }
        .brand i { color: var(--primary); font-size: 26px; filter: drop-shadow(0 0 10px var(--primary-glow)); }

        .nav-menu { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        
        .nav-btn {
            width: 100%; padding: 15px 18px; background: transparent;
            border: 1px solid transparent; color: var(--text-muted);
            font-size: 15px; font-weight: 700; border-radius: var(--radius-md);
            cursor: pointer; display: flex; align-items: center; gap: 14px;
            transition: var(--transition); text-align: left;
        }
        .nav-btn i { font-size: 18px; width: 22px; text-align: center; }
        .nav-btn:hover { color: var(--text-main); background: var(--surface-hover); }
        .nav-btn.active {
            background: rgba(245, 158, 11, 0.1); color: var(--primary);
            border-color: rgba(245, 158, 11, 0.25); box-shadow: 0 0 15px rgba(245, 158, 11, 0.1);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1; padding: 35px; overflow-y: auto;
            position: relative; z-index: 10; width: 100%;
        }

        /* Top Bar */
        .topbar {
            display: flex; justify-content: flex-end; align-items: center;
            margin-bottom: 25px;
        }
        .auth-box {
            position: relative; width: 100%; max-width: 280px;
        }
        .auth-box i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 15px;
        }
        .auth-box input {
            width: 100%; padding: 13px 16px 13px 45px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); color: var(--text-main);
            font-size: 14px; font-weight: 500; transition: var(--transition);
        }
        .auth-box input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 10px var(--primary-glow); }

        /* Panels */
        .panel { display: none; animation: fadeIn 0.3s ease forwards; }
        .panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-header { margin-bottom: 25px; }
        .panel-title { font-size: 24px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .panel-title i { color: var(--primary); }
        .panel-desc { color: var(--text-muted); margin-top: 6px; font-size: 14px; }

        /* Form Elements & Cards */
        .form-card {
            background: var(--surface); border: 1px solid var(--border);
            padding: 25px; border-radius: var(--radius-lg); margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block; font-size: 13px; color: var(--text-muted);
            margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border); border-radius: var(--radius-md);
            color: var(--text-main); font-size: 14px; transition: var(--transition);
        }
        .input-group textarea {
            min-height: 120px; font-family: monospace; resize: vertical; line-height: 1.5;
        }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: var(--primary); outline: none; background: rgba(0,0,0,0.5);
        }

        .btn-action {
            padding: 15px 20px; border-radius: var(--radius-md); border: none;
            font-size: 15px; font-weight: 800; color: #000; cursor: pointer;
            background: var(--primary); transition: var(--transition);
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25); width: 100%;
        }
        .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Grid Cards for Hub */
        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;
        }
        .hub-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 20px;
            display: flex; flex-direction: column; transition: var(--transition);
        }
        .hub-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
        }
        .hub-title { font-size: 17px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .hub-title i { color: var(--primary); }

        .script-list { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .script-item {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.04);
            border-radius: var(--radius-md); padding: 12px 15px;
        }
        .script-name { font-weight: 700; color: var(--success); font-size: 14px; display: block; margin-bottom: 4px; }
        .script-url { font-family: monospace; font-size: 11px; color: var(--text-muted); word-break: break-all; max-height: 50px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 6px; border-radius: 6px; margin-bottom: 8px; }
        
        .action-row { display: flex; gap: 6px; }
        
        /* Buttons */
        .btn-sm {
            padding: 7px 12px; border-radius: 8px; border: 1px solid transparent;
            font-size: 12px; font-weight: 700; cursor: pointer;
            display: inline-flex; align-items: center; gap: 5px; transition: var(--transition);
        }
        .btn-edit { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(16, 185, 129, 0.2); }
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: rgba(239, 68, 68, 0.2); }
        .btn-ban { background: rgba(245, 158, 11, 0.1); color: var(--primary); border-color: rgba(245, 158, 11, 0.2); }

        /* Table Design */
        .table-container {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
        th, td { padding: 15px 18px; border-bottom: 1px solid var(--border); }
        th { background: rgba(0,0,0,0.3); font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
        td { font-size: 13px; }
        tr:hover td { background: rgba(255,255,255,0.01); }
        
        .badge {
            padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); display: inline-block;
        }
        .badge.universal { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(16, 185, 129, 0.2); }

        /* Toast Notifications */
        #toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px; max-width: 90%;
        }
        .toast {
            background: var(--surface); border-left: 4px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); padding: 14px 20px;
            border-radius: 8px; display: flex; align-items: center; gap: 12px;
            color: var(--text-main); font-weight: 600; font-size: 13px;
            border: 1px solid var(--border); animation: toastEnter 0.3s ease forwards;
        }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast i { font-size: 18px; }
        .toast.success i { color: var(--success); }
        .toast.error i { color: var(--danger); }
        @keyframes toastEnter { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastExit { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(20px); } }

        /* ===== MOBILE RESPONSIVE STYLES ===== */
        @media screen and (max-width: 850px) {
            .mobile-header { display: flex; }
            body { flex-direction: column; height: auto; overflow-y: auto; }
            .sidebar {
                position: fixed; top: 0; left: -280px; height: 100vh; width: 260px;
                background: #0f1013; box-shadow: 10px 0 30px rgba(0,0,0,0.8);
                transition: var(--transition); padding-top: 90px;
            }
            .sidebar.open { left: 0; }
            .main-content { padding: 90px 15px 30px 15px; height: auto; overflow: visible; }
            .topbar { justify-content: center; margin-bottom: 20px; }
            .auth-box { max-width: 100%; }
            .grid-container { grid-template-columns: 1fr; }
            .form-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- Mobile Header -->
    <div class="mobile-header">
        <div class="mobile-brand"><i class="fa-solid fa-code"></i> SubX Pro</div>
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="brand"><i class="fa-solid fa-code"></i> SubX Pro</div>
        <div class="nav-menu">
            <button class="nav-btn active" onclick="switchPanel('addPanel', this)"><i class="fa-solid fa-circle-plus"></i> Add Content</button>
            <button class="nav-btn" onclick="switchPanel('managePanel', this); fetchHubData();"><i class="fa-solid fa-layer-group"></i> Manage Hub</button>
            <button class="nav-btn" onclick="switchPanel('keysPanel', this); fetchKeys();"><i class="fa-solid fa-key"></i> Access Keys</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="topbar">
            <div class="auth-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="adminKey" placeholder="Admin Password" autocomplete="off">
            </div>
        </div>

        <!-- Panel: Add Content -->
        <div id="addPanel" class="panel active">
            <div class="panel-header">
                <h2 class="panel-title"><i class="fa-solid fa-square-plus"></i> Add New Content</h2>
                <p class="panel-desc">Create a new game folder or inject scripts (URLs or Lua code).</p>
            </div>

            <div class="form-card">
                <div class="input-group">
                    <label>Action Type</label>
                    <select id="addType" onchange="toggleAddType()">
                        <option value="map">🎮 Create New Map Folder</option>
                        <option value="script">📜 Add Script to Existing Map</option>
                    </select>
                </div>
                
                <div id="mapFields">
                    <div class="input-group">
                        <label>Map Name</label>
                        <input type="text" id="mapName" placeholder="e.g. Blox Fruits">
                    </div>
                </div>
                
                <div id="scriptFields" style="display:none;">
                    <div class="input-group">
                        <label>Select Target Map</label>
                        <select id="targetMapSelect"><option value="">Loading maps...</option></select>
                    </div>
                    <div class="input-group">
                        <label>Script Name</label>
                        <input type="text" id="scriptName" placeholder="e.g. Auto Farm Hub">
                    </div>
                    <div class="input-group">
                        <label>Script Source (URL or Full Lua Code)</label>
                        <textarea id="scriptUrl" placeholder='loadstring(game:HttpGet("..."))()'></textarea>
                    </div>
                </div>

                <button class="btn-action" onclick="executeAdd()"><i class="fa-solid fa-cloud-arrow-up"></i> Save & Deploy</button>
            </div>
        </div>

        <!-- Panel: Manage Hub -->
        <div id="managePanel" class="panel">
            <div class="panel-header">
                <h2 class="panel-title"><i class="fa-solid fa-layer-group"></i> Manage Scripts</h2>
                <p class="panel-desc">View, edit script content, or delete items instantly.</p>
            </div>
            <div class="grid-container" id="mapsContainer">
                <!-- Cards will load here -->
            </div>
        </div>

        <!-- Panel: Manage Keys -->
        <div id="keysPanel" class="panel">
            <div class="panel-header">
                <h2 class="panel-title"><i class="fa-solid fa-key"></i> Key Management</h2>
                <p class="panel-desc">Generate licenses, renew periods, or ban abusers.</p>
            </div>

            <div class="form-card">
                <div class="input-group">
                    <label>Duration (Hours)</label>
                    <input type="number" id="keyHours" value="24" min="1">
                </div>
                <div class="input-group">
                    <label>Assign to HWID (Optional)</label>
                    <input type="text" id="keyHwid" placeholder="Leave blank for universal key...">
                </div>
                <button class="btn-action" onclick="generateCustomKey()">
                    <i class="fa-solid fa-bolt"></i> Generate Key
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Key</th>
                            <th>HWID</th>
                            <th>Expires</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="keysTableBody">
                        <!-- Keys will load here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        // Sidebar Toggle for Mobile
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function switchPanel(panelId, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            if(btn) btn.classList.add('active');
            if(window.innerWidth <= 850) toggleSidebar();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'toastExit 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        let cachedHubs = [];

        function toggleAddType() {
            const isMap = document.getElementById('addType').value === 'map';
            document.getElementById('mapFields').style.display = isMap ? 'block' : 'none';
            document.getElementById('scriptFields').style.display = isMap ? 'none' : 'block';
            if(!isMap) loadMapDropdown();
        }

        async function loadMapDropdown() {
            const select = document.getElementById('targetMapSelect');
            select.innerHTML = '<option value="">Loading...</option>';
            try {
                const res = await fetch('/api/scripts');
                const data = await res.json();
                if(data.success) {
                    cachedHubs = data.games || [];
                    select.innerHTML = '<option value="" disabled selected>-- Select Target Game --</option>';
                    cachedHubs.forEach(g => select.innerHTML += `<option value="${g.id}">${g.gameName}</option>`);
                } else select.innerHTML = '<option value="">Error loading maps</option>';
            } catch(e) { select.innerHTML = '<option value="">Could not load maps</option>'; }
        }

        async function executeAdd() {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return showToast("Admin Password Required!", "error");
            
            const type = document.getElementById('addType').value;
            if(type === 'map') {
                const gameName = document.getElementById('mapName').value.trim();
                if(!gameName) return showToast("Enter a map name!", "error");
                try {
                    const res = await fetch('/api/scripts', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ adminKey, gameName, scripts: [] })
                    });
                    const data = await res.json();
                    if(data.success) { showToast("Game Folder Created!"); document.getElementById('mapName').value = ''; }
                    else showToast(data.message || "Error", "error");
                } catch(e) { showToast("Network error", "error"); }
            } else {
                const mapId = document.getElementById('targetMapSelect').value;
                const scriptName = document.getElementById('scriptName').value.trim();
                const scriptUrl = document.getElementById('scriptUrl').value.trim();
                const targetGame = cachedHubs.find(g => g.id === mapId);
                
                if(!targetGame || !scriptName || !scriptUrl) return showToast("Fill all script fields!", "error");
                
                const updatedScripts = [...(targetGame.scripts || []), { name: scriptName, url: scriptUrl }];
                try {
                    const res = await fetch('/api/scripts', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: updatedScripts })
                    });
                    const data = await res.json();
                    if(data.success) { 
                        showToast("Script Injected Successfully!"); 
                        document.getElementById('scriptName').value = ''; document.getElementById('scriptUrl').value = ''; 
                    }
                    else showToast(data.message || "Error", "error");
                } catch(e) { showToast("Network error", "error"); }
            }
        }

        async function fetchHubData() {
            const container = document.getElementById('mapsContainer');
            container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-muted);"><i class="fa-solid fa-circle-notch fa-spin fa-2x"></i></div>';
            try {
                const res = await fetch('/api/scripts');
                const data = await res.json();
                if(data.success) {
                    cachedHubs = data.games || [];
                    container.innerHTML = '';
                    if(cachedHubs.length === 0) {
                        container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-muted);">No content available.</div>';
                        return;
                    }
                    cachedHubs.forEach(g => {
                        let scriptsHtml = '';
                        if(g.scripts && g.scripts.length > 0) {
                            g.scripts.forEach((s, idx) => {
                                const encName = encodeURIComponent(s.name);
                                const encUrl = encodeURIComponent(s.url);
                                scriptsHtml += `
                                    <div class="script-item">
                                        <div class="script-info">
                                            <span class="script-name"><i class="fa-solid fa-file-code"></i> ${s.name}</span>
                                            <div class="script-url">${s.url}</div>
                                        </div>
                                        <div class="action-row">
                                            <button class="btn-sm btn-edit" onclick="editScript('${g.id}', ${idx}, '${encName}', '${encUrl}')"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                                            <button class="btn-sm btn-delete" onclick="deleteScript('${g.id}', ${idx})"><i class="fa-solid fa-trash-can"></i> Delete</button>
                                        </div>
                                    </div>
                                `;
                            });
                        } else {
                            scriptsHtml = '<div style="font-size:12px; color:var(--text-muted); text-align:center; padding:15px 0;">Folder is empty</div>';
                        }
                        container.innerHTML += `
                            <div class="hub-card">
                                <div class="hub-header">
                                    <div class="hub-title"><i class="fa-solid fa-gamepad"></i> ${g.gameName}</div>
                                    <button class="btn-sm btn-delete" onclick="deleteMap('${g.id}')"><i class="fa-solid fa-folder-minus"></i></button>
                                </div>
                                <div class="script-list">${scriptsHtml}</div>
                            </div>
                        `;
                    });
                }
            } catch(e) { container.innerHTML = '<div style="color:var(--danger);">Error loading data</div>'; }
        }

        async function deleteMap(id) {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return showToast("Admin Password Required!", "error");
            if(!confirm("⚠️ Delete this entire map folder?")) return;
            try {
                const res = await fetch('/api/scripts', {
                    method: 'DELETE', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id, adminKey })
                });
                const data = await res.json();
                if(data.success) { showToast("Map Deleted!"); fetchHubData(); }
                else showToast(data.message, "error");
            } catch(e) { showToast("Network error", "error"); }
        }

        async function deleteScript(mapId, scriptIdx) {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return showToast("Admin Password Required!", "error");
            if(!confirm("Delete this script?")) return;
            
            const targetGame = cachedHubs.find(g => g.id === mapId);
            const updatedScripts = [...targetGame.scripts];
            updatedScripts.splice(scriptIdx, 1);
            
            try {
                const res = await fetch('/api/scripts', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: updatedScripts })
                });
                const data = await res.json();
                if(data.success) { showToast("Script Removed!"); fetchHubData(); }
            } catch(e) { showToast("Network error", "error"); }
        }

        async function editScript(mapId, scriptIdx, encName, encUrl) {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return showToast("Admin Password Required!", "error");
            
            const targetGame = cachedHubs.find(g => g.id === mapId);
            const oldName = decodeURIComponent(encName);
            const oldUrl = decodeURIComponent(encUrl);
            
            const newName = prompt("Edit Script Name:", oldName);
            if(newName === null) return;
            // استخدام نافذة تعديل واسعة تدعم الأكواد الطويلة بدلاً من prompt البسيط
            const newUrl = prompt("Edit Script Source / Lua Code:", oldUrl);
            if(newUrl === null || newUrl.trim() === "") return;
            
            const updatedScripts = [...targetGame.scripts];
            updatedScripts[scriptIdx] = { name: newName.trim(), url: newUrl.trim() };
            
            try {
                const res = await fetch('/api/scripts', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: updatedScripts })
                });
                const data = await res.json();
                if(data.success) { showToast("Script Updated Successfully!"); fetchHubData(); }
            } catch(e) { showToast("Network error", "error"); }
        }

        // ================= KEY MANAGEMENT =================

        async function fetchKeys() {
            const tbody = document.getElementById('keysTableBody');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:30px;"><i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--text-muted);"></i></td></tr>';
            try {
                const res = await fetch('/api/keys');
                const data = await res.json();
                if(data.success) {
                    tbody.innerHTML = '';
                    if(data.keys.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No active keys in database.</td></tr>';
                        return;
                    }
                    data.keys.forEach(k => {
                        const expiryDate = new Date(k.expiresAt).toLocaleString();
                        const isUniversal = !k.hwid || k.hwid === "";
                        const hwidDisplay = isUniversal ? '<span class="badge universal">Universal</span>' : `<span class="badge">HWID Linked</span>`;
                        
                        let actionsHtml = `
                            <button class="btn-sm btn-edit" onclick="renewKey('${k.key}')" title="Add Time"><i class="fa-solid fa-clock-rotate-left"></i></button>
                            <button class="btn-sm btn-delete" onclick="deleteKey('${k.key}')" title="Revoke"><i class="fa-solid fa-trash-can"></i></button>
                        `;
                        if (!isUniversal) {
                            actionsHtml += `<button class="btn-sm btn-ban" onclick="banUser('${k.hwid}')" title="Ban HWID"><i class="fa-solid fa-gavel"></i></button>`;
                        }

                        tbody.innerHTML += `
                            <tr>
                                <td style="font-family:monospace; color:var(--primary); font-weight: bold;">${k.key}</td>
                                <td>${hwidDisplay}</td>
                                <td style="font-size: 12px; color: var(--text-muted);">${expiryDate}</td>
                                <td><div class="action-row">${actionsHtml}</div></td>
                            </tr>
                        `;
                    });
                }
            } catch(e) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--danger);">Connection Error</td></tr>'; }
        }

        async function generateCustomKey() {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return showToast("Admin Password Required!", "error");
            
            const hours = parseInt(document.getElementById('keyHours').value) || 24;
            const hwid = document.getElementById('keyHwid').value.trim(); 

            try {
                const res = await fetch('/api/keys', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: 'create', adminKey, hours, hwid })
                });
                
                const data = await res.json();
                if(data.success) {
                    showToast(`Key Generated: ${data.key}`);
                    document.getElementById('keyHwid').value = ''; 
                    fetchKeys();
                } else showToast(data.message, "error");
            } catch(e) { showToast("Generation error", "error"); }
        }

        async function deleteKey(key) {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return showToast("Admin Password Required!", "error");
            if(!confirm("Revoke this key immediately?")) return;
            try {
                const res = await fetch('/api/keys', {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: 'delete', key, adminKey })
                });
                const data = await res.json();
                if(data.success) { showToast("Key Revoked!"); fetchKeys(); }
                else showToast(data.message, "error");
            } catch(e) { showToast("Network error", "error"); }
        }

        async function renewKey(key) {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return showToast("Admin Password Required!", "error");
            
            const extraHours = prompt("Add additional hours:", "24");
            if (extraHours === null || isNaN(parseInt(extraHours))) return;

            try {
                const res = await fetch('/api/renew-key', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ key, adminKey, hours: parseInt(extraHours) })
                });
                const data = await res.json();
                if(data.success) { showToast("Key Renewed!"); fetchKeys(); }
                else showToast(data.message, "error");
            } catch(e) { showToast("Network error", "error"); }
        }

        async function banUser(hwid) {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return showToast("Admin Password Required!", "error");
            if(!confirm(`⚠️ PERMANENT BAN\n\nAre you sure you want to ban this HWID?`)) return;

            try {
                const res = await fetch('/api/ban-user', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ hwid, adminKey })
                });
                const data = await res.json();
                if(data.success) { showToast("User Banned & Keys Destroyed!"); fetchKeys(); }
                else showToast(data.message, "error");
            } catch(e) { showToast("Network error", "error"); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(document.getElementById('addType').value === 'script') loadMapDropdown();
        });
    </script>
</body>
</html>

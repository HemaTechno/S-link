<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubX Pro Dashboard 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #07080b;
            --sidebar-bg: rgba(12, 14, 20, 0.9);
            --glass-bg: rgba(18, 20, 28, 0.75);
            --glass-border: rgba(255, 215, 0, 0.15);
            --primary-gold: #ffd700;
            --success-green: #4ade80;
            --danger-red: #f87171;
            --text-main: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 215, 0, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(74, 222, 128, 0.05) 0px, transparent 50%);
            display: flex; height: 100vh; overflow: hidden; color: var(--text-main);
        }

        .sidebar {
            width: 260px; background: var(--sidebar-bg); backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; padding: 25px 15px;
        }
        .sidebar-brand { font-size: 20px; font-weight: 800; color: var(--primary-gold); display: flex; align-items: center; gap: 10px; margin-bottom: 35px; padding-left: 10px; }
        .nav-btn {
            width: 100%; padding: 14px 18px; background: transparent; border: none; color: #9ca3af;
            font-size: 14px; font-weight: 700; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px;
            transition: 0.3s; margin-bottom: 8px; text-align: left;
        }
        .nav-btn:hover, .nav-btn.active { background: rgba(255, 215, 0, 0.1); color: var(--primary-gold); border: 1px solid rgba(255, 215, 0, 0.2); }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; position: relative; }
        
        .panel { display: none; width: 100%; max-width: 800px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); padding: 35px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        .panel.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 20px; font-weight: 800; color: var(--primary-gold); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: 600; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: #fff; font-size: 13px; outline: none; transition: 0.3s;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary-gold); box-shadow: 0 0 10px rgba(255,215,0,0.1); }
        .input-group select option { background: #111; }

        .btn-action {
            width: 100%; padding: 14px; border-radius: 12px; border: none; cursor: pointer;
            font-size: 14px; font-weight: 800; color: #000;
            background: linear-gradient(135deg, var(--primary-gold) 0%, #b89b00 100%);
            transition: 0.3s; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,215,0,0.2); }

        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .data-table th, .data-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .data-table th { color: var(--primary-gold); font-weight: 700; background: rgba(0,0,0,0.3); }
        .action-btns { display: flex; gap: 6px; }
        .btn-sm { padding: 5px 10px; border-radius: 6px; border: none; font-size: 11px; font-weight: 700; cursor: pointer; }
        .btn-edit { background: rgba(255, 215, 0, 0.2); color: var(--primary-gold); }
        .btn-delete { background: rgba(248, 113, 113, 0.2); color: var(--danger-red); }

        .auth-box { position: absolute; top: 30px; right: 40px; width: 220px; z-index: 10; }
        #statusMsg { text-align: center; margin-top: 10px; font-weight: 700; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Sidebar Bar -->
    <div class="sidebar">
        <div class="sidebar-brand"><i class="fa-solid fa-crown"></i> SubX Admin</div>
        <button class="nav-btn active" onclick="switchPanel('addPanel', this)"><i class="fa-solid fa-plus-circle"></i> Add Map / Script</button>
        <button class="nav-btn" onclick="switchPanel('managePanel', this); fetchHubData();"><i class="fa-solid fa-folder-open"></i> Manage Hub</button>
        <button class="nav-btn" onclick="switchPanel('keysPanel', this); fetchKeys();"><i class="fa-solid fa-key"></i> Manage Keys</button>
    </div>

    <div class="main-content">
        
        <!-- Admin Password -->
        <div class="auth-box">
            <input type="password" id="adminKey" placeholder="Admin Password..." style="width:100%; padding: 10px; background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.15); border-radius:8px; color:#fff; font-size:12px; outline:none;">
        </div>

        <!-- 1. Add Panel -->
        <div id="addPanel" class="panel active">
            <h2><i class="fa-solid fa-circle-plus"></i> Add Map or Script</h2>
            
            <div class="input-group">
                <label>Action Type</label>
                <select id="addType" onchange="toggleAddType()">
                    <option value="map">Create New Map Folder</option>
                    <option value="script">Add Script to Map</option>
                </select>
            </div>

            <div id="mapFields">
                <div class="input-group">
                    <label>Map Name</label>
                    <input type="text" id="mapName" placeholder="e.g. Blox Fruits">
                </div>
            </div>

            <div id="scriptFields" style="display:none;">
                <div class="input-group">
                    <label>Select Target Map</label>
                    <select id="targetMapSelect"><option value="">Loading maps...</option></select>
                </div>
                <div class="input-group">
                    <label>Script Name</label>
                    <input type="text" id="scriptName" placeholder="e.g. Auto Farm Hub">
                </div>
                <div class="input-group">
                    <label>Script URL / Loadstring</label>
                    <input type="text" id="scriptUrl" placeholder="https://raw.githubusercontent.com/...">
                </div>
            </div>

            <button class="btn-action" onclick="executeAdd()"><i class="fa-solid fa-save"></i> Save Data</button>
            <p id="statusMsg"></p>
        </div>

        <!-- 2. Manage Hub Panel (Edit & Delete Scripts/Maps) -->
        <div id="managePanel" class="panel">
            <h2><i class="fa-solid fa-folder-tree"></i> Manage Maps & Scripts</h2>
            <div style="max-height: 400px; overflow-y: auto;">
                <div id="mapsContainer">Loading...</div>
            </div>
        </div>

        <!-- 3. Manage Keys Panel -->
        <div id="keysPanel" class="panel">
            <h2><i class="fa-solid fa-key"></i> Custom & Universal Keys</h2>
            
            <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                <div class="input-group">
                    <label>Expiration Hours (e.g. 24 = 1 Day, 720 = 30 Days)</label>
                    <input type="number" id="keyHours" value="24">
                </div>
                <button class="btn-action" onclick="generateCustomKey()"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Universal Key</button>
            </div>

            <div style="max-height: 250px; overflow-y: auto;">
                <table class="data-table">
                    <thead>
                        <tr><th>Key</th><th>Expires At</th><th>Action</th></tr>
                    </thead>
                    <tbody id="keysTableBody">
                        <tr><td colspan="3" style="text-align:center; color:#888;">Loading keys...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let cachedHubs = [];

        function switchPanel(panelId, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            btn.classList.add('active');
        }

        function toggleAddType() {
            const type = document.getElementById('addType').value;
            if(type === 'map') {
                document.getElementById('mapFields').style.display = 'block';
                document.getElementById('scriptFields').style.display = 'none';
            } else {
                document.getElementById('mapFields').style.display = 'none';
                document.getElementById('scriptFields').style.display = 'block';
                loadMapDropdown();
            }
        }

        async function loadMapDropdown() {
            const select = document.getElementById('targetMapSelect');
            select.innerHTML = '<option value="">Loading...</option>';
            const res = await fetch('/api/scripts');
            const data = await res.json();
            if(data.success) {
                cachedHubs = data.games;
                select.innerHTML = '<option value="">-- Select Map --</option>';
                data.games.forEach(g => {
                    select.innerHTML += `<option value="${g.id}">${g.gameName}</option>`;
                });
            }
        }

        async function executeAdd() {
            const adminKey = document.getElementById('adminKey').value;
            const type = document.getElementById('addType').value;
            const status = document.getElementById('statusMsg');

            if(type === 'map') {
                const gameName = document.getElementById('mapName').value;
                if(!gameName) return showStatus("Enter map name!", "#ff4d4d");
                
                const res = await fetch('/api/scripts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ adminKey, gameName, scripts: [] })
                });
                const data = await res.json();
                if(data.success) showStatus("Map created successfully! ✅", "#4ade80");
                else showStatus(data.message, "#ff4d4d");

            } else {
                const mapId = document.getElementById('targetMapSelect').value;
                const scriptName = document.getElementById('scriptName').value;
                const scriptUrl = document.getElementById('scriptUrl').value;
                
                const targetGame = cachedHubs.find(g => g.id === mapId);
                if(!targetGame || !scriptName || !scriptUrl) return showStatus("Fill all fields!", "#ff4d4d");

                const updatedScripts = [...targetGame.scripts, { name: scriptName, url: scriptUrl }];
                const res = await fetch('/api/scripts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: updatedScripts })
                });
                const data = await res.json();
                if(data.success) showStatus("Script added successfully! ✅", "#4ade80");
                else showStatus(data.message, "#ff4d4d");
            }
        }

        async function fetchHubData() {
            const container = document.getElementById('mapsContainer');
            container.innerHTML = 'Loading...';
            const res = await fetch('/api/scripts');
            const data = await res.json();
            if(data.success) {
                cachedHubs = data.games;
                container.innerHTML = '';
                data.games.forEach(g => {
                    let scriptsHtml = '';
                    g.scripts.forEach((s, idx) => {
                        scriptsHtml += `
                            <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.3); padding:8px 12px; border-radius:8px; margin-top:5px;">
                                <span style="font-size:12px;">📄 ${s.name}</span>
                                <div class="action-btns">
                                    <button class="btn-sm btn-edit" onclick="editScript('${g.id}', ${idx}, '${s.name}', '${s.url}')">Edit</button>
                                    <button class="btn-sm btn-delete" onclick="deleteScript('${g.id}', ${idx})">Delete</button>
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML += `
                        <div style="background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-bottom:15px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                                <h3 style="color:var(--primary-gold); font-size:15px;">🎮 ${g.gameName}</h3>
                                <button class="btn-sm btn-delete" onclick="deleteMap('${g.id}')">Delete Map</button>
                            </div>
                            ${scriptsHtml || '<p style="font-size:11px; color:#777;">No scripts in this map.</p>'}
                        </div>
                    `;
                });
            }
        }

        async function deleteMap(id) {
            const adminKey = document.getElementById('adminKey').value;
            if(!confirm("Delete this map and all its scripts?")) return;
            await fetch('/api/scripts', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, adminKey })
            });
            fetchHubData();
        }

        async function deleteScript(mapId, scriptIdx) {
            const adminKey = document.getElementById('adminKey').value;
            const targetGame = cachedHubs.find(g => g.id === mapId);
            if(!targetGame) return;

            targetGame.scripts.splice(scriptIdx, 1); // حذف السكربت من القائمة

            await fetch('/api/scripts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: targetGame.scripts })
            });
            fetchHubData();
        }

        async function editScript(mapId, scriptIdx, oldName, oldUrl) {
            const adminKey = document.getElementById('adminKey').value;
            const targetGame = cachedHubs.find(g => g.id === mapId);
            if(!targetGame) return;

            const newName = prompt("Edit Script Name:", oldName);
            if(newName === null) return;
            const newUrl = prompt("Edit Script URL / Loadstring:", oldUrl);
            if(newUrl === null) return;

            targetGame.scripts[scriptIdx] = { name: newName, url: newUrl };

            await fetch('/api/scripts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: targetGame.scripts })
            });
            fetchHubData();
        }

        async function fetchKeys() {
            const tbody = document.getElementById('keysTableBody');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Loading...</td></tr>';
            const res = await fetch('/api/keys');
            const data = await res.json();
            if(data.success) {
                tbody.innerHTML = '';
                data.keys.forEach(k => {
                    const expiryDate = new Date(k.expiresAt).toLocaleString();
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-family:monospace; font-size:11px;">${k.key}</td>
                            <td>${expiryDate}</td>
                            <td><button class="btn-sm btn-delete" onclick="deleteKey('${k.key}')">Delete</button></td>
                        </tr>
                    `;
                });
            }
        }

        async function deleteKey(key) {
            const adminKey = document.getElementById('adminKey').value;
            if(!confirm("Delete this key?")) return;
            await fetch('/api/keys', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ key, adminKey })
            });
            fetchKeys();
        }

        async function generateCustomKey() {
            const adminKey = document.getElementById('adminKey').value;
            const hours = parseInt(document.getElementById('keyHours').value) || 24;
            
            const res = await fetch('/api/create-key', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ adminKey, hours })
            });
            const data = await res.json();
            if(data.success) {
                alert("Key Generated: " + data.key);
                fetchKeys();
            } else {
                alert("Error: " + data.message);
            }
        }

        function showStatus(text, color) {
            const status = document.getElementById('statusMsg');
            status.style.color = color;
            status.innerHTML = text;
            setTimeout(() => status.innerHTML = '', 4000);
        }
    </script>
</body>
</html>

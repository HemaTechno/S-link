<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>SubX Pro Dashboard 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #07090f;
            --sidebar-bg: rgba(12, 14, 22, 0.94);
            --glass-bg: rgba(18, 21, 31, 0.80);
            --glass-border: rgba(255, 215, 0, 0.15);
            --primary-gold: #ffd700;
            --success-green: #4ade80;
            --danger-red: #f87171;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --radius-card: 20px;
            --radius-sm: 14px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 215, 0, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(74, 222, 128, 0.05) 0px, transparent 50%);
            display: flex;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 270px;
            min-width: 200px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 28px 16px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            transition: transform var(--transition), margin var(--transition);
            z-index: 30;
        }
        .sidebar-brand {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-gold);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            padding: 0 4px;
            flex-wrap: wrap;
        }
        .sidebar-brand i { font-size: 26px; }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 700;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
            margin-bottom: 8px;
            text-align: left;
            line-height: 1.3;
        }
        .nav-btn i { font-size: 18px; min-width: 22px; }
        .nav-btn:hover, .nav-btn.active {
            background: rgba(255, 215, 0, 0.10);
            color: var(--primary-gold);
            border: 1px solid rgba(255, 215, 0, 0.20);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.04);
        }

        /* toggle button for mobile */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 50;
            background: rgba(12, 14, 22, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 22px;
            color: var(--primary-gold);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
        }
        .sidebar-toggle:hover { background: rgba(255, 215, 0, 0.15); }

        /* ===== MAIN ===== */
        .main-content {
            flex: 1;
            padding: 24px 28px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            min-width: 0;
            width: 100%;
            height: 100vh;
        }

        .panel {
            display: none;
            width: 100%;
            max-width: 950px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            padding: 32px 30px;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow);
            margin: 0 auto;
        }
        .panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-gold);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h2 i { font-size: 24px; }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 12px rgba(255,215,0,0.10);
        }
        .input-group select option {
            background: #1a1d27;
            color: #fff;
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            color: #000;
            background: linear-gradient(135deg, var(--primary-gold) 0%, #b89b00 100%);
            transition: var(--transition);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.25);
        }

        /* cards */
        .map-card {
            background: rgba(0, 0, 0, 0.40);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-card);
            padding: 20px 22px;
            margin-bottom: 22px;
            transition: var(--transition);
        }
        .map-card:hover { border-color: rgba(255, 215, 0, 0.15); }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 12px;
        }
        .map-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .script-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .script-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 200px;
            min-width: 140px;
        }
        .script-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .script-url {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .script-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            white-space: nowrap;
            background: rgba(255,255,255,0.04);
            color: var(--text-muted);
        }
        .btn-edit {
            background: rgba(255, 215, 0, 0.12);
            color: var(--primary-gold);
            border: 1px solid rgba(255, 215, 0, 0.20);
        }
        .btn-edit:hover { background: rgba(255, 215, 0, 0.25); }
        .btn-delete {
            background: rgba(248, 113, 113, 0.12);
            color: var(--danger-red);
            border: 1px solid rgba(248, 113, 113, 0.20);
        }
        .btn-delete:hover { background: rgba(248, 113, 113, 0.25); }

        /* table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        .data-table th, .data-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
            word-break: break-word;
        }
        .data-table th {
            color: var(--primary-gold);
            font-weight: 700;
            background: rgba(0,0,0,0.35);
        }
        .data-table td:last-child { text-align: right; }

        .auth-box {
            position: sticky;
            top: 20px;
            z-index: 10;
            width: 100%;
            max-width: 260px;
            margin-left: auto;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0,0,0,0.70);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .auth-box input:focus { border-color: var(--primary-gold); }

        #statusMsg {
            text-align: center;
            margin-top: 18px;
            font-weight: 700;
            font-size: 14px;
            min-height: 26px;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.25); border-radius: 12px; }

        /* ===== RESPONSIVE ===== */
        @media screen and (max-width: 820px) {
            body { flex-direction: column; height: auto; overflow-y: auto; }
            
            .sidebar-toggle {
                display: flex !important;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 280px;
                height: 100vh;
                transform: translateX(-100%);
                margin: 0;
                border-right: 1px solid var(--glass-border);
                border-radius: 0 20px 20px 0;
                box-shadow: 0 0 60px rgba(0,0,0,0.8);
                padding: 28px 18px;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 40;
                background: rgba(7, 9, 15, 0.96);
                backdrop-filter: blur(30px);
                -webkit-backdrop-filter: blur(30px);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-brand { margin-bottom: 30px; }
            .nav-btn { padding: 14px 16px; font-size: 15px; }

            .main-content {
                padding: 16px;
                height: auto;
                min-height: 100vh;
                display: block;
                padding-top: 80px;
            }
            .panel {
                padding: 24px 18px;
                margin: 10px 0;
                border-radius: 18px;
            }
            .auth-box {
                position: relative;
                top: 0;
                max-width: 100%;
                margin: 0 0 18px 0;
            }
            .map-header { flex-direction: column; align-items: flex-start; }
            .script-item { flex-direction: column; align-items: stretch; }
            .script-actions { justify-content: flex-start; }
            .data-table th, .data-table td { padding: 12px 10px; font-size: 13px; }
            .btn-sm { padding: 6px 12px; font-size: 12px; }
        }

        @media screen and (max-width: 480px) {
            .sidebar { width: 260px; padding: 20px 14px; }
            .sidebar-brand { font-size: 20px; }
            .nav-btn { padding: 12px 14px; font-size: 14px; gap: 12px; }
            .main-content { padding: 12px; padding-top: 76px; }
            .panel { padding: 18px 12px; }
            h2 { font-size: 19px; }
            .input-group input, .input-group select { padding: 12px 14px; font-size: 14px; }
            .btn-action { padding: 14px; font-size: 15px; }
            .map-card { padding: 16px; }
            .script-item { padding: 10px 12px; }
            .script-name { font-size: 14px; }
            .data-table th, .data-table td { padding: 10px 6px; font-size: 12px; display: block; width: 100%; }
            .data-table td:last-child { text-align: left; }
            .data-table tr { display: block; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
            .data-table thead { display: none; }
            .sidebar-toggle { width: 44px; height: 44px; font-size: 20px; top: 12px; left: 12px; }
        }
        @media screen and (max-width: 360px) {
            .nav-btn { font-size: 13px; padding: 10px 12px; }
            .sidebar-brand { font-size: 18px; }
        }

        /* overlay when sidebar open */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 35;
        }
        .sidebar-overlay.active { display: block; }
    </style>
</head>
<body>

    <!-- Toggle Button (visible on mobile) -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand"><i class="fa-solid fa-crown"></i> SubX Admin</div>
        <button class="nav-btn active" onclick="switchPanel('addPanel', this)"><i class="fa-solid fa-plus-circle"></i> Add Map / Script</button>
        <button class="nav-btn" onclick="switchPanel('managePanel', this); fetchHubData();"><i class="fa-solid fa-folder-open"></i> Manage Hub</button>
        <button class="nav-btn" onclick="switchPanel('keysPanel', this); fetchKeys();"><i class="fa-solid fa-key"></i> Manage Keys</button>
    </div>

    <div class="main-content">
        <div style="width:100%; display:flex; flex-direction:column;">
            <!-- Admin Password Box -->
            <div class="auth-box">
                <input type="password" id="adminKey" placeholder="Admin Password..." aria-label="Admin Password">
            </div>

            <!-- Add Panel -->
            <div id="addPanel" class="panel active">
                <h2><i class="fa-solid fa-circle-plus"></i> Add Map or Script</h2>
                <div class="input-group">
                    <label>Action Type</label>
                    <select id="addType" onchange="toggleAddType()">
                        <option value="map">Create New Map Folder</option>
                        <option value="script">Add Script to Map</option>
                    </select>
                </div>
                <div id="mapFields">
                    <div class="input-group">
                        <label>Map Name</label>
                        <input type="text" id="mapName" placeholder="e.g. Blox Fruits">
                    </div>
                </div>
                <div id="scriptFields" style="display:none;">
                    <div class="input-group">
                        <label>Select Target Map</label>
                        <select id="targetMapSelect"><option value="">Loading maps...</option></select>
                    </div>
                    <div class="input-group">
                        <label>Script Name</label>
                        <input type="text" id="scriptName" placeholder="e.g. Auto Farm Hub">
                    </div>
                    <div class="input-group">
                        <label>Script URL / Loadstring</label>
                        <input type="text" id="scriptUrl" placeholder="https://raw.githubusercontent.com/...">
                    </div>
                </div>
                <button class="btn-action" onclick="executeAdd()"><i class="fa-solid fa-save"></i> Save Data</button>
                <p id="statusMsg"></p>
            </div>

            <!-- Manage Hub -->
            <div id="managePanel" class="panel">
                <h2><i class="fa-solid fa-folder-tree"></i> Manage Maps & Scripts</h2>
                <div style="max-height: 60vh; overflow-y: auto; padding-right: 4px;" id="mapsContainer">
                    <p style="text-align:center; color:var(--text-muted); padding:20px;">Loading hub data...</p>
                </div>
            </div>

            <!-- Keys Panel -->
            <div id="keysPanel" class="panel">
                <h2><i class="fa-solid fa-key"></i> Custom & Universal Keys</h2>
                <div style="background: rgba(0,0,0,0.30); padding: 20px; border-radius: 18px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05);">
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label>Expiration Hours (e.g. 24 = 1 Day, 720 = 30 Days)</label>
                        <input type="number" id="keyHours" value="24" min="1">
                    </div>
                    <button class="btn-action" onclick="generateCustomKey()"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Universal Key</button>
                </div>
                <div style="max-height: 350px; overflow-y: auto; width:100%;">
                    <table class="data-table">
                        <thead><tr><th>Key</th><th>Expires At</th><th>Action</th></tr></thead>
                        <tbody id="keysTableBody">
                            <tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Loading keys...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== SIDEBAR TOGGLE (mobile) =====
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
            const icon = toggleBtn.querySelector('i');
            if(sidebar.classList.contains('open')) {
                icon.className = 'fa-solid fa-xmark';
            } else {
                icon.className = 'fa-solid fa-bars';
            }
        }

        toggleBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // close sidebar when a nav button is clicked (mobile)
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if(window.innerWidth <= 820 && sidebar.classList.contains('open')) {
                    toggleSidebar();
                }
            });
        });

        // ===== EXISTING LOGIC (unchanged) =====
        let cachedHubs = [];

        function switchPanel(panelId, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        function toggleAddType() {
            const type = document.getElementById('addType').value;
            if(type === 'map') {
                document.getElementById('mapFields').style.display = 'block';
                document.getElementById('scriptFields').style.display = 'none';
            } else {
                document.getElementById('mapFields').style.display = 'none';
                document.getElementById('scriptFields').style.display = 'block';
                loadMapDropdown();
            }
        }

        async function loadMapDropdown() {
            const select = document.getElementById('targetMapSelect');
            select.innerHTML = '<option value="">Loading...</option>';
            try {
                const res = await fetch('/api/scripts');
                const data = await res.json();
                if(data.success) {
                    cachedHubs = data.games || [];
                    select.innerHTML = '<option value="">-- Select Map --</option>';
                    data.games.forEach(g => {
                        select.innerHTML += `<option value="${g.id}">${g.gameName}</option>`;
                    });
                } else {
                    select.innerHTML = '<option value="">Error loading maps</option>';
                }
            } catch(e) {
                select.innerHTML = '<option value="">Could not load maps</option>';
            }
        }

        async function executeAdd() {
            const adminKey = document.getElementById('adminKey').value;
            const type = document.getElementById('addType').value;
            const status = document.getElementById('statusMsg');

            if(type === 'map') {
                const gameName = document.getElementById('mapName').value.trim();
                if(!gameName) return showStatus("Enter map name!", "#ff4d4d");
                try {
                    const res = await fetch('/api/scripts', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ adminKey, gameName, scripts: [] })
                    });
                    const data = await res.json();
                    if(data.success) showStatus("Map created successfully! ✅", "#4ade80");
                    else showStatus(data.message || "Error", "#ff4d4d");
                } catch(e) { showStatus("Network error", "#ff4d4d"); }
            } else {
                const mapId = document.getElementById('targetMapSelect').value;
                const scriptName = document.getElementById('scriptName').value.trim();
                const scriptUrl = document.getElementById('scriptUrl').value.trim();
                const targetGame = cachedHubs.find(g => g.id === mapId);
                if(!targetGame || !scriptName || !scriptUrl) return showStatus("Fill all fields!", "#ff4d4d");
                const updatedScripts = [...(targetGame.scripts || []), { name: scriptName, url: scriptUrl }];
                try {
                    const res = await fetch('/api/scripts', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: updatedScripts })
                    });
                    const data = await res.json();
                    if(data.success) showStatus("Script added successfully! ✅", "#4ade80");
                    else showStatus(data.message || "Error", "#ff4d4d");
                } catch(e) { showStatus("Network error", "#ff4d4d"); }
            }
        }

        async function fetchHubData() {
            const container = document.getElementById('mapsContainer');
            container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">Loading maps and scripts...</p>';
            try {
                const res = await fetch('/api/scripts');
                const data = await res.json();
                if(data.success) {
                    cachedHubs = data.games || [];
                    container.innerHTML = '';
                    if(cachedHubs.length === 0) {
                        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No maps found yet.</p>';
                        return;
                    }
                    cachedHubs.forEach(g => {
                        let scriptsHtml = '';
                        if(g.scripts && g.scripts.length > 0) {
                            g.scripts.forEach((s, idx) => {
                                const safeName = s.name.replace(/'/g, "\\'");
                                const safeUrl = s.url.replace(/'/g, "\\'");
                                scriptsHtml += `
                                    <div class="script-item">
                                        <div class="script-info">
                                            <span class="script-name"><i class="fa-solid fa-code" style="color:var(--success-green); margin-right:6px;"></i> ${s.name}</span>
                                            <span class="script-url">${s.url}</span>
                                        </div>
                                        <div class="script-actions">
                                            <button class="btn-sm btn-edit" onclick="editScript('${g.id}', ${idx}, '${safeName}', '${safeUrl}')"><i class="fa-solid fa-pen"></i> Edit</button>
                                            <button class="btn-sm btn-delete" onclick="deleteScript('${g.id}', ${idx})"><i class="fa-solid fa-trash"></i> Delete</button>
                                        </div>
                                    </div>
                                `;
                            });
                        } else {
                            scriptsHtml = '<p style="font-size:13px; color:var(--text-muted); padding:6px 0;">No scripts added to this map yet.</p>';
                        }
                        container.innerHTML += `
                            <div class="map-card">
                                <div class="map-header">
                                    <span class="map-title"><i class="fa-solid fa-gamepad"></i> ${g.gameName}</span>
                                    <button class="btn-sm btn-delete" onclick="deleteMap('${g.id}')"><i class="fa-solid fa-trash-can"></i> Delete Map</button>
                                </div>
                                <div class="script-list">${scriptsHtml}</div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Failed to load data</p>';
                }
            } catch(e) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Network error</p>';
            }
        }

        async function deleteMap(id) {
            const adminKey = document.getElementById('adminKey').value;
            if(!confirm("Delete this map and all scripts?")) return;
            try {
                const res = await fetch('/api/scripts', {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id, adminKey })
                });
                const data = await res.json();
                if(data.success) fetchHubData();
                else alert("Error: " + data.message);
            } catch(e) { alert("Network error"); }
        }

        async function deleteScript(mapId, scriptIdx) {
            const adminKey = document.getElementById('adminKey').value;
            const targetGame = cachedHubs.find(g => g.id === mapId);
            if(!targetGame) return;
            if(!confirm("Delete this script?")) return;
            targetGame.scripts.splice(scriptIdx, 1);
            try {
                const res = await fetch('/api/scripts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: targetGame.scripts })
                });
                const data = await res.json();
                if(data.success) fetchHubData();
                else alert("Error: " + data.message);
            } catch(e) { alert("Network error"); }
        }

        async function editScript(mapId, scriptIdx, oldName, oldUrl) {
            const adminKey = document.getElementById('adminKey').value;
            const targetGame = cachedHubs.find(g => g.id === mapId);
            if(!targetGame) return;
            const newName = prompt("Edit Script Name:", oldName);
            if(newName === null) return;
            const newUrl = prompt("Edit Script URL / Loadstring:", oldUrl);
            if(newUrl === null) return;
            targetGame.scripts[scriptIdx] = { name: newName, url: newUrl };
            try {
                const res = await fetch('/api/scripts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: targetGame.scripts })
                });
                const data = await res.json();
                if(data.success) fetchHubData();
                else alert("Error: " + data.message);
            } catch(e) { alert("Network error"); }
        }

        async function fetchKeys() {
            const tbody = document.getElementById('keysTableBody');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Loading keys...</td></tr>';
            try {
                const res = await fetch('/api/keys');
                const data = await res.json();
                if(data.success) {
                    tbody.innerHTML = '';
                    if(data.keys.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">No active keys found.</td></tr>';
                        return;
                    }
                    data.keys.forEach(k => {
                        const expiryDate = new Date(k.expiresAt).toLocaleString();
                        tbody.innerHTML += `
                            <tr>
                                <td style="font-family:monospace; font-size:13px; color:var(--primary-gold); word-break:break-all;">${k.key}</td>
                                <td>${expiryDate}</td>
                                <td><button class="btn-sm btn-delete" onclick="deleteKey('${k.key}')"><i class="fa-solid fa-trash"></i> Delete</button></td>
                            </tr>
                        `;
                    });
                }
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Error loading keys</td></tr>';
            }
        }

        async function deleteKey(key) {
            const adminKey = document.getElementById('adminKey').value;
            if(!confirm("Delete this key?")) return;
            try {
                await fetch('/api/keys', {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ key, adminKey })
                });
                fetchKeys();
            } catch(e) { alert("Network error"); }
        }

        async function generateCustomKey() {
            const adminKey = document.getElementById('adminKey').value;
            const hours = parseInt(document.getElementById('keyHours').value) || 24;
            try {
                const res = await fetch('/api/create-key', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ adminKey, hours })
                });
                const data = await res.json();
                if(data.success) {
                    alert("Key Generated Successfully: " + data.key);
                    fetchKeys();
                } else {
                    alert("Error: " + data.message);
                }
            } catch(e) { alert("Network error"); }
        }

        function showStatus(text, color) {
            const status = document.getElementById('statusMsg');
            status.style.color = color || '#fff';
            status.innerHTML = text;
            setTimeout(() => status.innerHTML = '', 4500);
        }

        document.addEventListener('DOMContentLoaded', function() {
            if(document.getElementById('addType').value === 'script') loadMapDropdown();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>SubX Pro Dashboard 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #050608;
            --sidebar-bg: rgba(10, 12, 18, 0.65);
            --glass-bg: rgba(15, 18, 25, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 215, 0, 0.25);
            --primary-gold: #ffd700;
            --primary-glow: 0 0 20px rgba(255, 215, 0, 0.15);
            --success-green: #4ade80;
            --danger-red: #f87171;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --radius-card: 24px;
            --radius-sm: 14px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 215, 0, 0.04), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(74, 222, 128, 0.04), transparent 25%);
            display: flex;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            min-width: 220px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            transition: transform var(--transition);
            z-index: 30;
            box-shadow: 5px 0 25px rgba(0,0,0,0.3);
        }
        .sidebar-brand {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-gold);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 45px;
            padding: 0 4px;
            text-shadow: var(--primary-glow);
        }
        .sidebar-brand i { font-size: 28px; }

        .nav-btn {
            width: 100%;
            padding: 15px 18px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 700;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
            margin-bottom: 10px;
            text-align: left;
        }
        .nav-btn i { font-size: 18px; min-width: 22px; }
        .nav-btn:hover, .nav-btn.active {
            background: rgba(255, 215, 0, 0.08);
            color: var(--primary-gold);
            border: 1px solid var(--glass-highlight);
            box-shadow: var(--primary-glow);
            transform: translateX(5px);
        }

        /* toggle button for mobile */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 50;
            background: rgba(15, 18, 25, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-highlight);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 22px;
            color: var(--primary-gold);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
            align-items: center;
            justify-content: center;
        }
        .sidebar-toggle:hover { background: rgba(255, 215, 0, 0.15); transform: scale(1.05); }

        /* ===== MAIN ===== */
        .main-content {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            min-width: 0;
            width: 100%;
            height: 100vh;
        }

        .panel {
            display: none;
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            padding: 35px 40px;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow);
            margin: 0 auto;
        }
        .panel.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-gold);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
            padding-left: 4px;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 15px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }
        .input-group input:focus,
        .input-group select:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: var(--primary-gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }
        .input-group select option { background: #12141c; color: #fff; }

        .btn-action {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            color: #000;
            background: linear-gradient(135deg, var(--primary-gold) 0%, #d4af37 100%);
            transition: var(--transition);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }
        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
            background: linear-gradient(135deg, #ffea00 0%, #e6be3e 100%);
        }

        /* cards */
        .map-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 22px 25px;
            margin-bottom: 22px;
            transition: var(--transition);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .map-card:hover { border-color: rgba(255, 215, 0, 0.2); box-shadow: 0 5px 20px rgba(0,0,0,0.3); }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }
        .map-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--primary-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .script-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: var(--transition);
        }
        .script-item:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
        .script-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1 1 200px;
            min-width: 140px;
        }
        .script-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .script-url {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 6px;
        }
        .script-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn-sm {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            background: rgba(0,0,0,0.4);
            color: var(--text-main);
        }
        .btn-edit { color: var(--primary-gold); border-color: rgba(255, 215, 0, 0.2); background: rgba(255, 215, 0, 0.05); }
        .btn-edit:hover { background: rgba(255, 215, 0, 0.15); transform: translateY(-2px); }
        .btn-delete { color: var(--danger-red); border-color: rgba(248, 113, 113, 0.2); background: rgba(248, 113, 113, 0.05); }
        .btn-delete:hover { background: rgba(248, 113, 113, 0.15); transform: translateY(-2px); }

        /* table */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .data-table th, .data-table td {
            padding: 15px 18px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
            word-break: break-word;
        }
        .data-table th { color: var(--primary-gold); font-weight: 700; background: rgba(0,0,0,0.4); border-radius: 8px 8px 0 0; }
        .data-table tr:hover td { background: rgba(255,255,255,0.02); }
        .data-table td:last-child { text-align: right; }

        .auth-box {
            position: sticky;
            top: 0;
            z-index: 10;
            width: 100%;
            max-width: 280px;
            margin-left: auto;
            margin-bottom: 25px;
            flex-shrink: 0;
        }
        .auth-box input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        .auth-box input:focus { border-color: var(--danger-red); box-shadow: 0 0 15px rgba(248, 113, 113, 0.2); }

        #statusMsg { text-align: center; margin-top: 18px; font-weight: 700; font-size: 14px; min-height: 26px; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,215,0,0.5); }

        /* ===== RESPONSIVE ===== */
        @media screen and (max-width: 850px) {
            body { flex-direction: column; height: auto; overflow-y: auto; }
            .sidebar-toggle { display: flex !important; }
            .sidebar {
                position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
                transform: translateX(-100%); margin: 0; border-right: 1px solid var(--glass-border);
                border-radius: 0 20px 20px 0; box-shadow: 0 0 60px rgba(0,0,0,0.8);
                z-index: 40; background: rgba(10, 12, 18, 0.95);
            }
            .sidebar.open { transform: translateX(0); }
            .main-content { padding: 16px; padding-top: 80px; height: auto; min-height: 100vh; display: block; }
            .panel { padding: 25px 20px; margin: 10px auto; border-radius: 20px; }
            .auth-box { max-width: 100%; margin-bottom: 20px; position: relative; }
            .map-header { flex-direction: column; align-items: flex-start; }
            .script-item { flex-direction: column; align-items: stretch; }
            .script-actions { justify-content: flex-start; }
        }
        @media screen and (max-width: 480px) {
            .sidebar { width: 260px; }
            .nav-btn { font-size: 14px; padding: 12px 15px; }
            h2 { font-size: 20px; }
            .btn-action { font-size: 15px; padding: 14px; }
            .data-table th, .data-table td { display: block; width: 100%; padding: 10px; text-align: left; }
            .data-table tr { display: block; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
            .data-table thead { display: none; }
            .data-table td:last-child { text-align: left; padding-top: 5px; }
        }

        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 35;
        }
        .sidebar-overlay.active { display: block; }
    </style>
</head>
<body>

    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar"><i class="fa-solid fa-bars"></i></button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand"><i class="fa-solid fa-crown"></i> SubX Admin</div>
        <button class="nav-btn active" onclick="switchPanel('addPanel', this)"><i class="fa-solid fa-plus-circle"></i> Add Map / Script</button>
        <button class="nav-btn" onclick="switchPanel('managePanel', this); fetchHubData();"><i class="fa-solid fa-folder-open"></i> Manage Hub</button>
        <button class="nav-btn" onclick="switchPanel('keysPanel', this); fetchKeys();"><i class="fa-solid fa-key"></i> Manage Keys</button>
    </div>

    <div class="main-content">
        <div style="width:100%; display:flex; flex-direction:column;">
            
            <div class="auth-box">
                <input type="password" id="adminKey" placeholder="Admin Password Required 🔒" aria-label="Admin Password">
            </div>

            <!-- Add Panel -->
            <div id="addPanel" class="panel active">
                <h2><i class="fa-solid fa-circle-plus"></i> Add Content</h2>
                <div class="input-group">
                    <label>Action Type</label>
                    <select id="addType" onchange="toggleAddType()">
                        <option value="map">Create New Map Folder</option>
                        <option value="script">Add Script to Map</option>
                    </select>
                </div>
                <div id="mapFields">
                    <div class="input-group">
                        <label>Map Name</label>
                        <input type="text" id="mapName" placeholder="e.g. Blox Fruits">
                    </div>
                </div>
                <div id="scriptFields" style="display:none;">
                    <div class="input-group">
                        <label>Select Target Map</label>
                        <select id="targetMapSelect"><option value="">Loading maps...</option></select>
                    </div>
                    <div class="input-group">
                        <label>Script Name</label>
                        <input type="text" id="scriptName" placeholder="e.g. Auto Farm Hub">
                    </div>
                    <div class="input-group">
                        <label>Script URL / Loadstring</label>
                        <input type="text" id="scriptUrl" placeholder="https://raw.githubusercontent.com/...">
                    </div>
                </div>
                <button class="btn-action" onclick="executeAdd()"><i class="fa-solid fa-save"></i> Save Data</button>
                <p id="statusMsg"></p>
            </div>

            <!-- Manage Hub Panel -->
            <div id="managePanel" class="panel">
                <h2><i class="fa-solid fa-folder-tree"></i> Manage Hub</h2>
                <div style="max-height: 65vh; overflow-y: auto; padding-right: 8px;" id="mapsContainer">
                    <p style="text-align:center; color:var(--text-muted); padding:20px;">Loading hub data...</p>
                </div>
            </div>

            <!-- Keys Panel -->
            <div id="keysPanel" class="panel">
                <h2><i class="fa-solid fa-key"></i> Universal Keys</h2>
                <div style="background: rgba(0,0,0,0.4); padding: 25px; border-radius: var(--radius-card); margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 0 0 15px rgba(0,0,0,0.5);">
                    <div class="input-group" style="margin-bottom: 15px;">
                        <label>Expiration Hours (e.g. 24 = 1 Day, 720 = 30 Days)</label>
                        <input type="number" id="keyHours" value="24" min="1">
                    </div>
                    <button class="btn-action" onclick="generateCustomKey()"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Key</button>
                </div>
                <div style="max-height: 400px; overflow-y: auto; width:100%;">
                    <table class="data-table">
                        <thead><tr><th>Key</th><th>Expires At</th><th>Action</th></tr></thead>
                        <tbody id="keysTableBody">
                            <tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Loading keys...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sidebar Toggle Logic
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
            toggleBtn.querySelector('i').className = sidebar.classList.contains('open') ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
        }

        toggleBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => { if(window.innerWidth <= 850 && sidebar.classList.contains('open')) toggleSidebar(); });
        });

        // Hub Logic
        let cachedHubs = [];

        function switchPanel(panelId, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        function toggleAddType() {
            const isMap = document.getElementById('addType').value === 'map';
            document.getElementById('mapFields').style.display = isMap ? 'block' : 'none';
            document.getElementById('scriptFields').style.display = isMap ? 'none' : 'block';
            if(!isMap) loadMapDropdown();
        }

        async function loadMapDropdown() {
            const select = document.getElementById('targetMapSelect');
            select.innerHTML = '<option value="">Loading...</option>';
            try {
                const res = await fetch('/api/scripts');
                const data = await res.json();
                if(data.success) {
                    cachedHubs = data.games || [];
                    select.innerHTML = '<option value="">-- Select Map --</option>';
                    cachedHubs.forEach(g => select.innerHTML += `<option value="${g.id}">${g.gameName}</option>`);
                } else select.innerHTML = '<option value="">Error loading maps</option>';
            } catch(e) { select.innerHTML = '<option value="">Could not load maps</option>'; }
        }

        async function executeAdd() {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return showStatus("Enter Admin Password!", "#f87171");
            const type = document.getElementById('addType').value;

            if(type === 'map') {
                const gameName = document.getElementById('mapName').value.trim();
                if(!gameName) return showStatus("Enter map name!", "#f87171");
                try {
                    const res = await fetch('/api/scripts', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ adminKey, gameName, scripts: [] })
                    });
                    const data = await res.json();
                    if(data.success) { showStatus("Map created! ✅", "#4ade80"); document.getElementById('mapName').value = ''; }
                    else showStatus(data.message || "Error", "#f87171");
                } catch(e) { showStatus("Network error", "#f87171"); }
            } else {
                const mapId = document.getElementById('targetMapSelect').value;
                const scriptName = document.getElementById('scriptName').value.trim();
                const scriptUrl = document.getElementById('scriptUrl').value.trim();
                const targetGame = cachedHubs.find(g => g.id === mapId);
                if(!targetGame || !scriptName || !scriptUrl) return showStatus("Fill all fields!", "#f87171");
                
                const updatedScripts = [...(targetGame.scripts || []), { name: scriptName, url: scriptUrl }];
                try {
                    const res = await fetch('/api/scripts', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: updatedScripts })
                    });
                    const data = await res.json();
                    if(data.success) { showStatus("Script added! ✅", "#4ade80"); document.getElementById('scriptName').value = ''; document.getElementById('scriptUrl').value = ''; }
                    else showStatus(data.message || "Error", "#f87171");
                } catch(e) { showStatus("Network error", "#f87171"); }
            }
        }

        async function fetchHubData() {
            const container = document.getElementById('mapsContainer');
            container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading maps and scripts...</p>';
            try {
                const res = await fetch('/api/scripts');
                const data = await res.json();
                if(data.success) {
                    cachedHubs = data.games || [];
                    container.innerHTML = '';
                    if(cachedHubs.length === 0) {
                        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No maps found yet.</p>';
                        return;
                    }
                    cachedHubs.forEach(g => {
                        let scriptsHtml = '';
                        if(g.scripts && g.scripts.length > 0) {
                            g.scripts.forEach((s, idx) => {
                                // التشفير الآمن لحل مشكلة علامات التنصيص في التعديل والحذف
                                const encName = encodeURIComponent(s.name);
                                const encUrl = encodeURIComponent(s.url);
                                scriptsHtml += `
                                    <div class="script-item">
                                        <div class="script-info">
                                            <span class="script-name"><i class="fa-solid fa-code" style="color:var(--success-green);"></i> ${s.name}</span>
                                            <span class="script-url">${s.url}</span>
                                        </div>
                                        <div class="script-actions">
                                            <button class="btn-sm btn-edit" onclick="editScript('${g.id}', ${idx}, '${encName}', '${encUrl}')"><i class="fa-solid fa-pen"></i> Edit</button>
                                            <button class="btn-sm btn-delete" onclick="deleteScript('${g.id}', ${idx})"><i class="fa-solid fa-trash"></i> Delete</button>
                                        </div>
                                    </div>
                                `;
                            });
                        } else {
                            scriptsHtml = '<p style="font-size:13px; color:var(--text-muted); padding:10px 0;">No scripts added to this map yet.</p>';
                        }
                        container.innerHTML += `
                            <div class="map-card">
                                <div class="map-header">
                                    <span class="map-title"><i class="fa-solid fa-gamepad"></i> ${g.gameName}</span>
                                    <button class="btn-sm btn-delete" onclick="deleteMap('${g.id}')"><i class="fa-solid fa-trash-can"></i> Delete Map</button>
                                </div>
                                <div class="script-list">${scriptsHtml}</div>
                            </div>
                        `;
                    });
                } else container.innerHTML = '<p style="text-align:center; color:#f87171;">Failed to load data</p>';
            } catch(e) { container.innerHTML = '<p style="text-align:center; color:#f87171;">Network error</p>'; }
        }

        async function deleteMap(id) {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return alert("Please enter Admin Password!");
            if(!confirm("Are you sure you want to delete this entire map?")) return;
            try {
                const res = await fetch('/api/scripts', {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id, adminKey })
                });
                const data = await res.json();
                if(data.success) fetchHubData();
                else alert("Error: " + data.message);
            } catch(e) { alert("Network error"); }
        }

        async function deleteScript(mapId, scriptIdx) {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return alert("Please enter Admin Password!");
            if(!confirm("Are you sure you want to delete this script?")) return;
            
            const targetGame = cachedHubs.find(g => g.id === mapId);
            if(!targetGame) return;
            
            // إنشاء مصفوفة جديدة بدون السكربت المحذوف
            const updatedScripts = [...targetGame.scripts];
            updatedScripts.splice(scriptIdx, 1);
            
            try {
                const res = await fetch('/api/scripts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: updatedScripts })
                });
                const data = await res.json();
                if(data.success) fetchHubData();
                else alert("Error: " + data.message);
            } catch(e) { alert("Network error"); }
        }

        async function editScript(mapId, scriptIdx, encName, encUrl) {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return alert("Please enter Admin Password!");
            
            const targetGame = cachedHubs.find(g => g.id === mapId);
            if(!targetGame) return;
            
            // فك التشفير الآمن لإظهار البيانات القديمة
            const oldName = decodeURIComponent(encName);
            const oldUrl = decodeURIComponent(encUrl);
            
            const newName = prompt("Edit Script Name:", oldName);
            if(newName === null) return;
            const newUrl = prompt("Edit Script URL / Loadstring:", oldUrl);
            if(newUrl === null || newUrl.trim() === "") return;
            
            const updatedScripts = [...targetGame.scripts];
            updatedScripts[scriptIdx] = { name: newName.trim(), url: newUrl.trim() };
            
            try {
                const res = await fetch('/api/scripts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ adminKey, gameName: targetGame.gameName, scripts: updatedScripts })
                });
                const data = await res.json();
                if(data.success) fetchHubData();
                else alert("Error: " + data.message);
            } catch(e) { alert("Network error"); }
        }

        async function fetchKeys() {
            const tbody = document.getElementById('keysTableBody');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--text-muted);"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading keys...</td></tr>';
            try {
                const res = await fetch('/api/keys');
                const data = await res.json();
                if(data.success) {
                    tbody.innerHTML = '';
                    if(data.keys.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">No active keys found.</td></tr>';
                        return;
                    }
                    data.keys.forEach(k => {
                        const expiryDate = new Date(k.expiresAt).toLocaleString();
                        tbody.innerHTML += `
                            <tr>
                                <td style="font-family:monospace; font-size:14px; color:var(--primary-gold); word-break:break-all;">${k.key}</td>
                                <td>${expiryDate}</td>
                                <td><button class="btn-sm btn-delete" onclick="deleteKey('${k.key}')"><i class="fa-solid fa-trash"></i> Delete</button></td>
                            </tr>
                        `;
                    });
                }
            } catch(e) { tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f87171;">Error loading keys</td></tr>'; }
        }

        async function deleteKey(key) {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return alert("Please enter Admin Password!");
            if(!confirm("Delete this key?")) return;
            try {
                const res = await fetch('/api/keys', {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ key, adminKey })
                });
                const data = await res.json();
                if(data.success) fetchKeys();
                else alert("Error: " + data.message);
            } catch(e) { alert("Network error"); }
        }

        async function generateCustomKey() {
            const adminKey = document.getElementById('adminKey').value;
            if(!adminKey) return alert("Please enter Admin Password!");
            const hours = parseInt(document.getElementById('keyHours').value) || 24;
            try {
                const res = await fetch('/api/create-key', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ adminKey, hours })
                });
                const data = await res.json();
                if(data.success) {
                    alert("Key Generated Successfully: " + data.key);
                    fetchKeys();
                } else alert("Error: " + data.message);
            } catch(e) { alert("Network error"); }
        }

        function showStatus(text, color) {
            const status = document.getElementById('statusMsg');
            status.style.color = color || '#fff';
            status.innerHTML = text;
            setTimeout(() => status.innerHTML = '', 4500);
        }

        document.addEventListener('DOMContentLoaded', function() {
            if(document.getElementById('addType').value === 'script') loadMapDropdown();
        });
    </script>
</body>
</html>

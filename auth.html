<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول | SubX</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ffd700;
            --bg-dark: #0c0d10;
            --glass-bg: rgba(20, 21, 25, 0.6);
            --text-main: #ffffff;
            --input-bg: rgba(0, 0, 0, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(at 50% 0%, rgba(255, 215, 0, 0.05) 0px, transparent 50%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-main); padding: 20px;
        }
        .container {
            width: 450px; max-width: 100%; padding: 40px 35px; border-radius: 28px;
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        h1 { color: var(--primary); margin-bottom: 10px; font-size: 1.8rem; }
        p.desc { color: #a0a0a0; margin-bottom: 30px; font-size: 1rem; }
        
        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; color: #d0d0d0; font-size: 0.95rem; font-weight: 500; }
        .input-group input {
            width: 100%; padding: 14px 18px; border-radius: 12px;
            background: var(--input-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; font-size: 1rem; outline: none; transition: border 0.3s;
        }
        .input-group input:focus { border-color: var(--primary); }

        .btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary) 0%, #b89b00 100%);
            color: #000; border: none; border-radius: 12px; cursor: pointer; font-size: 1.1rem; font-weight: 800;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.3s; margin-top: 10px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255, 215, 0, 0.2); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .toggle-form { margin-top: 20px; font-size: 0.95rem; color: #a0a0a0; cursor: pointer; }
        .toggle-form span { color: var(--primary); font-weight: bold; text-decoration: underline; }
        
        .alert {
            display: none; padding: 12px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; font-size: 0.9rem; text-align: center;
        }
        .alert.error { background: rgba(255, 94, 94, 0.1); color: #ff5e5e; border: 1px solid rgba(255, 94, 94, 0.3); }
        .alert.warning { background: rgba(255, 189, 46, 0.1); color: #ffbd2e; border: 1px solid rgba(255, 189, 46, 0.3); }
        .alert.success { background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }

        /* إخفاء نموذج التسجيل افتراضياً */
        #registerForm { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- منطقة التنبيهات -->
        <div id="alertBox" class="alert"></div>

        <!-- نموذج تسجيل الدخول -->
        <div id="loginForm">
            <h1>تسجيل الدخول</h1>
            <p class="desc">أهلاً بك مجدداً في لوحة التحكم</p>
            
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="name@domain.com">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            
            <!-- أزلنا الـ onclick وتم ربطه من الـ JS عبر الـ ID -->
            <button class="btn" id="loginBtn">
                دخول <i class="fa-solid fa-arrow-left"></i>
            </button>
            
            <div class="toggle-form" id="showRegForm">
                ليس لديك حساب؟ <span>طلب انضمام</span>
            </div>
        </div>

        <!-- نموذج إنشاء الحساب -->
        <div id="registerForm">
            <h1>طلب انضمام</h1>
            <p class="desc">سجل بياناتك وسيتم مراجعة حسابك</p>
            
            <div class="input-group">
                <label>الاسم الكامل</label>
                <input type="text" id="regName" placeholder="محمد أحمد">
            </div>
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="regEmail" placeholder="name@domain.com">
            </div>
            <div class="input-group">
                <label>رابط قناتك / ديسكورد / تليجرام</label>
                <input type="url" id="regLink" placeholder="https://t.me/yourchannel">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="regPassword" placeholder="••••••••">
            </div>
            
            <button class="btn" id="regBtn">
                إرسال الطلب <i class="fa-solid fa-paper-plane"></i>
            </button>
            
            <div class="toggle-form" id="showLoginForm">
                لديك حساب بالفعل؟ <span>تسجيل الدخول</span>
            </div>
        </div>
    </div>

    <!-- استدعاء ملف الجافاسكريبت الخارجي كـ Module -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>

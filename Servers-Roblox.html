<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باحث السيرفرات الفاضية | Roblox</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { margin-top: 0; color: #00d2ff; }
        p.subtitle { color: #aaa; margin-bottom: 30px; font-size: 16px; }
        
        /* تصميم شبكة المابات */
        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .map-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .map-btn:hover {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
        }

        .map-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .server-card {
            background: rgba(0, 255, 136, 0.1);
            padding: 20px;
            margin-top: 30px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, 0.3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .join-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        .join-btn:hover { background: #218838; box-shadow: 0 0 15px rgba(40, 167, 69, 0.5); }
        #status { font-size: 16px; color: #fff; margin-top: 20px; min-height: 25px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>صائد السيرفرات الفاضية 🎯</h1>
        <p class="subtitle">اختر اللعبة اللي عاوز تفرّم فيها، وهنجيبلك سيرفر فاضي فوراً!</p>
        
        <!-- قسم أزرار المابات المشهورة -->
        <div class="maps-grid" id="mapsGrid">
            <div class="map-btn" onclick="startSearch('2753915549', 'Blox Fruits')">🍎 Blox Fruits</div>
            <div class="map-btn" onclick="startSearch('4924922222', 'Brookhaven')">🏡 Brookhaven</div>
            <div class="map-btn" onclick="startSearch('142823681', 'Murder Mystery 2')">🔪 MM2</div>
            <div class="map-btn" onclick="startSearch('4520749081', 'King Legacy')">👑 King Legacy</div>
            <div class="map-btn" onclick="startSearch('8737899170', 'Pet Simulator 99')">🐶 Pet Sim 99</div>
            <div class="map-btn" onclick="startSearch('606849621', 'Jailbreak')">🚓 Jailbreak</div>
            <div class="map-btn" onclick="startSearch('2788229376', 'Da Hood')">👊 Da Hood</div>
            <div class="map-btn" onclick="startSearch('13772394625', 'Blade Ball')">⚔️ Blade Ball</div>
            <div class="map-btn" onclick="startSearch('920587237', 'Adopt Me!')">🦄 Adopt Me!</div>
            <div class="map-btn" onclick="startSearch('286090429', 'Arsenal')">🔫 Arsenal</div>
        </div>

        <p id="status"></p>
        <div id="result"></div>
    </div>

    <script>
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        let isSearching = false; // عشان نمنع المستخدم من الضغط على كذا ماب في نفس الوقت

        async function startSearch(placeId, mapName) {
            // لو هو بيبحث حالياً، نمنعه يبدأ بحث جديد لحد ما يخلص
            if (isSearching) return;
            isSearching = true;

            const statusText = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            const mapsGrid = document.getElementById('mapsGrid');
            
            // إضافة تأثير بهتان للأزرار وقت البحث
            mapsGrid.style.opacity = "0.5";
            mapsGrid.style.pointerEvents = "none";
            
            resultDiv.innerHTML = "";
            statusText.style.color = "#00d2ff";

            try {
                let cursor = '';
                let found = false;
                let pageCount = 1;

                // حلقة البحث
                while (!found) {
                    statusText.innerText = `🔍 جاري فحص سيرفرات ${mapName} (الصفحة ${pageCount})...`;

                    const res = await fetch(`/api/proxy?placeId=${placeId}&cursor=${cursor}`);
                    
                    if (res.status === 429) {
                        statusText.innerText = `⏳ روبلوكس طلبت نهدي اللعب شوية.. هنستنى 3 ثواني ونكمل..`;
                        statusText.style.color = "#ffc107";
                        await sleep(3000);
                        continue;
                    }

                    const data = await res.json();
                    statusText.style.color = "#00d2ff"; // رجع اللون الأساسي

                    if (!data.data || data.data.length === 0) {
                        statusText.innerText = `السيرفرات خلصت ومفيش سيرفر فاضي في ${mapName} حالياً!`;
                        break;
                    }

                    // البحث عن سيرفر فيه 0 أو 1 لاعبين
                    const emptyServer = data.data.find(s => s.playing <= 1);

                    if (emptyServer) {
                        found = true;
                        statusText.innerText = "";
                        resultDiv.innerHTML = `
                            <div class="server-card">
                                <h3>لقينا سيرفر فاضي في ${mapName}! 🎉</h3>
                                <p>عدد اللاعبين: <strong>${emptyServer.playing}</strong> | البينج: ${emptyServer.ping || 'غير متوفر'}ms</p>
                                <a href="roblox://placeId=${placeId}&gameInstanceId=${emptyServer.id}" class="join-btn">
                                    دخول السيرفر الآن 🚀
                                </a>
                            </div>
                        `;
                        break;
                    }

                    if (data.nextPageCursor) {
                        cursor = data.nextPageCursor;
                        pageCount++;
                        await sleep(500); // تأخير نص ثانية بين كل صفحة
                    } else {
                        statusText.innerText = `تم فحص كل السيرفرات، مفيش سيرفر فاضي لـ ${mapName} للأسف.`;
                        break;
                    }
                }
            } catch (err) {
                statusText.innerText = "⚠️ حصلت مشكلة في الاتصال، تأكد من الإنترنت أو جرب تاني.";
                statusText.style.color = "#ff4d4d";
            } finally {
                // نرجع الأزرار تشتغل تاني بعد ما البحث يخلص
                isSearching = false;
                mapsGrid.style.opacity = "1";
                mapsGrid.style.pointerEvents = "auto";
            }
        }
    </script>
</body>
</html>

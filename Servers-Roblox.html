<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باحث السيرفرات الفاضية | Roblox</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { margin-top: 0; color: #00d2ff; }
        input, button {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        input {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s;
        }
        input:focus { border-color: #00d2ff; }
        button {
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; }
        .server-card {
            background: rgba(0, 255, 136, 0.1);
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        .join-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        .join-btn:hover { background: #218838; box-shadow: 0 0 15px rgba(40, 167, 69, 0.5); }
        #status { font-size: 15px; color: #ccc; margin-top: 15px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>صائد السيرفرات الفاضية 🎯</h1>
        <p>ابحث باسم الماب (مثال: Blox Fruits) أو باللينك أو بالـ ID</p>
        
        <input type="text" id="placeInput" placeholder="أدخل اسم الماب، الرابط، أو الـ ID..." />
        <button onclick="startSearch()" id="searchBtn">ابحث عن سيرفر فاضي</button>
        
        <p id="status"></p>
        <div id="result"></div>
    </div>

    <script>
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // دالة لتحليل المدخل (اسم، رابط، أو ID)
        async function extractPlaceId(input) {
            const statusText = document.getElementById('status');

            // 1. لو المستخدم دخل أرقام فقط (ID)
            if (/^\d+$/.test(input)) {
                return input;
            }

            // 2. لو المستخدم دخل لينك الماب (يستخرج الأرقام من الرابط)
            const linkMatch = input.match(/(?:games\/)(\d+)/);
            if (linkMatch && linkMatch[1]) {
                return linkMatch[1];
            }

            // 3. لو المستخدم دخل اسم الماب
            statusText.innerText = "جاري البحث عن اسم الماب في روبلوكس...";
            try {
                const res = await fetch(`/api/search?name=${encodeURIComponent(input)}`);
                const data = await res.json();
                
                if (data.placeId) {
                    statusText.innerText = `تم العثور على ماب: ${data.name}.. بنجيب السيرفرات...`;
                    return data.placeId;
                } else {
                    throw new Error("ملقيناش ماب بالاسم ده، جرب اسم تاني!");
                }
            } catch (error) {
                throw new Error("فشل البحث عن الماب. جرب تحط اللينك أو الـ ID.");
            }
        }

        async function startSearch() {
            const rawInput = document.getElementById('placeInput').value.trim();
            const statusText = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            const searchBtn = document.getElementById('searchBtn');
            
            if(!rawInput) return alert("الرجاء إدخال اسم، لينك، أو ID الماب!");

            searchBtn.disabled = true;
            resultDiv.innerHTML = "";
            statusText.style.color = "#ccc";

            try {
                // استخراج الـ ID
                const placeId = await extractPlaceId(rawInput);
                
                let cursor = '';
                let found = false;
                let pageCount = 1;

                // حلقة البحث في صفحات السيرفرات
                while (!found) {
                    statusText.innerText = `جاري فحص الصفحة رقم ${pageCount}...`;

                    const res = await fetch(`/api/proxy?placeId=${placeId}&cursor=${cursor}`);
                    
                    // لو وصلنا لليمت روبلوكس، المتصفح هيريح 3 ثواني ويكمل
                    if (res.status === 429) {
                        statusText.innerText = `روبلوكس طلبت نهدي اللعب شوية.. هنستنى 3 ثواني ونكمل..`;
                        statusText.style.color = "#ffc107";
                        await sleep(3000);
                        continue;
                    }

                    const data = await res.json();
                    statusText.style.color = "#ccc"; // نرجع اللون الطبيعي

                    if (!data.data || data.data.length === 0) {
                        statusText.innerText = "السيرفرات خلصت ومفيش سيرفر فاضي تماماً!";
                        break;
                    }

                    // البحث عن سيرفر فيه لاعب واحد أو أقل
                    const emptyServer = data.data.find(s => s.playing <= 1);

                    if (emptyServer) {
                        found = true;
                        statusText.innerText = "";
                        resultDiv.innerHTML = `
                            <div class="server-card">
                                <h3>لقينا سيرفر! 🎉</h3>
                                <p>عدد اللاعبين: <strong>${emptyServer.playing}</strong> | البينج: ${emptyServer.ping || 'غير متوفر'}ms</p>
                                <a href="roblox://placeId=${placeId}&gameInstanceId=${emptyServer.id}" class="join-btn">
                                    دخول السيرفر الآن 🚀
                                </a>
                            </div>
                        `;
                        break;
                    }

                    // الانتقال للصفحة التالية إن وجدت
                    if (data.nextPageCursor) {
                        cursor = data.nextPageCursor;
                        pageCount++;
                        // تأخير نص ثانية بين كل صفحة عشان نتجنب الـ Rate Limit
                        await sleep(500); 
                    } else {
                        statusText.innerText = "تم فحص كل السيرفرات المتاحة، مفيش سيرفر فاضي للأسف.";
                        break;
                    }
                }
            } catch (err) {
                statusText.innerText = err.message;
                statusText.style.color = "#ff4d4d";
            } finally {
                searchBtn.disabled = false;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Roblox Empty Server Finder | Auto Join VIP Servers</title>
    <meta name="description" content="Find and join completely empty Roblox servers with zero players instantly. Support for Blox Fruits, Brookhaven, Lumber Tycoon 2, and more top games.">
    <meta name="keywords" content="Roblox empty server, Blox fruits VIP server free, empty server finder, zero player server roblox, auto join roblox">
    <meta name="author" content="HemaTech">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph (For Discord/Facebook/Twitter embeds) -->
    <meta property="og:title" content="Roblox Empty Server Finder 🎯">
    <meta property="og:description" content="Click instantly to find a zero-player server for your favorite Roblox games.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#0d1117">

    <style>
        /* Modern Dark Theme matching the provided screenshot */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            background-color: #050505;
            /* Dotted background pattern */
            background-image: radial-gradient(#1a1d24 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            color: #e6e6e6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #0d1117; /* Dark card background */
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #1f232d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 { margin-top: 0; color: #ffffff; font-size: 24px; font-weight: 700; }
        p.subtitle { color: #8b949e; margin-bottom: 25px; font-size: 14px; }
        
        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .map-btn {
            background: #161b22;
            border: 1px solid #21262d;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            font-weight: 600;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .map-btn:hover {
            background: #1f6feb; /* Accent blue */
            border-color: #388bfd;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .server-card {
            background: #161b22;
            padding: 20px;
            margin-top: 25px;
            border-radius: 12px;
            border: 1px solid #2ea043;
            animation: fadeIn 0.4s ease;
        }
        .server-card.warning { border-color: #d29922; }
        .server-card h3 { margin-top: 0; font-size: 18px; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .join-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #238636;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 15px;
            transition: 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .join-btn:hover { background: #2ea043; }
        .join-btn.warning-btn { background: #d29922; color: #000; }
        .join-btn.warning-btn:hover { background: #e3b341; }

        #status { font-size: 14px; color: #8b949e; margin-top: 20px; min-height: 20px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎯 Empty Server Hunter</h1>
        <p class="subtitle">Select a game to instantly find a server with 0 players.</p>
        
        <div class="maps-grid" id="mapsGrid">
            <div class="map-btn" onclick="startSearch('2753915549', 'Blox Fruits')">🍎 Blox Fruits</div>
            <div class="map-btn" onclick="startSearch('4924922222', 'Brookhaven')">🏡 Brookhaven</div>
            <div class="map-btn" onclick="startSearch('13822889', 'Lumber Tycoon 2')">🪓 Lumber Tycoon 2</div>
            <div class="map-btn" onclick="startSearch('142823681', 'Murder Mystery 2')">🔪 MM2</div>
            <div class="map-btn" onclick="startSearch('4520749081', 'King Legacy')">👑 King Legacy</div>
            <div class="map-btn" onclick="startSearch('8737899170', 'Pet Simulator 99')">🐶 Pet Sim 99</div>
        </div>

        <p id="status"></p>
        <div id="result"></div>
    </div>

    <script>
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        let isSearching = false;

        // دالة إرسال النتيجة لملف الويب هوك المؤمن في Vercel
        async function notifyDiscord(mapName, placeId, players, serverId) {
            try {
                await fetch('/api/webhook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mapName, placeId, players, serverId })
                });
            } catch (e) {
                console.log("Failed to send webhook notification.");
            }
        }

        async function startSearch(placeId, mapName) {
            if (isSearching) return;
            isSearching = true;

            const statusText = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            const mapsGrid = document.getElementById('mapsGrid');
            
            mapsGrid.style.opacity = "0.5";
            mapsGrid.style.pointerEvents = "none";
            resultDiv.innerHTML = "";
            statusText.style.color = "#58a6ff";

            try {
                let cursor = '';
                let found = false;
                let pageCount = 1;
                let lowestServer = null;

                while (!found) {
                    statusText.innerText = `🔍 Scanning servers for ${mapName} (Page ${pageCount})...`;

                    const res = await fetch(`/api/proxy?placeId=${placeId}&cursor=${cursor}`);
                    
                    if (res.status === 429) {
                        statusText.innerText = `⏳ Rate limited by Roblox. Pausing for 3 seconds...`;
                        statusText.style.color = "#d29922";
                        await sleep(3000);
                        continue;
                    }

                    const data = await res.json();
                    statusText.style.color = "#58a6ff";

                    if (!data.data || data.data.length === 0) break;

                    data.data.forEach(s => {
                        if (!lowestServer || s.playing < lowestServer.playing) lowestServer = s;
                    });

                    const emptyServer = data.data.find(s => s.playing <= 1);

                    if (emptyServer) {
                        found = true;
                        statusText.innerText = "";
                        resultDiv.innerHTML = `
                            <div class="server-card">
                                <h3>🎉 Empty Server Found!</h3>
                                <p style="font-size: 14px; color: #8b949e; margin-bottom: 15px;">
                                    Players: <strong>${emptyServer.playing}</strong> | Ping: ${emptyServer.ping || 'N/A'}ms
                                </p>
                                <a href="roblox://placeId=${placeId}&gameInstanceId=${emptyServer.id}" class="join-btn">
                                    Join Server Now 🚀
                                </a>
                            </div>
                        `;
                        // إرسال إشعار الديسكورد
                        notifyDiscord(mapName, placeId, emptyServer.playing, emptyServer.id);
                        break;
                    }

                    if (data.nextPageCursor) {
                        cursor = data.nextPageCursor;
                        pageCount++;
                        await sleep(500); 
                    } else {
                        break;
                    }
                }

                if (!found) {
                    if (lowestServer) {
                        statusText.innerText = `No completely empty servers found for ${mapName}.`;
                        statusText.style.color = "#8b949e";
                        
                        resultDiv.innerHTML = `
                            <div class="server-card warning">
                                <h3 style="color: #d29922;">⚠️ Lowest Server Available</h3>
                                <p style="font-size: 14px; color: #8b949e; margin-bottom: 5px;">
                                    Players: <strong>${lowestServer.playing}</strong> | Ping: ${lowestServer.ping || 'N/A'}ms
                                </p>
                                <p style="font-size: 12px; color: #6e7681; margin-bottom: 15px;">Would you like to join this instead?</p>
                                <a href="roblox://placeId=${placeId}&gameInstanceId=${lowestServer.id}" class="join-btn warning-btn">
                                    Join Lowest Server 🚀
                                </a>
                            </div>
                        `;
                        // إرسال إشعار الديسكورد للسيرفر البديل
                        notifyDiscord(mapName, placeId, lowestServer.playing, lowestServer.id);
                    } else {
                        statusText.innerText = `No servers available for ${mapName} right now!`;
                        statusText.style.color = "#f85149";
                    }
                }

            } catch (err) {
                statusText.innerText = "⚠️ Connection error. Please check your internet.";
                statusText.style.color = "#f85149";
            } finally {
                isSearching = false;
                mapsGrid.style.opacity = "1";
                mapsGrid.style.pointerEvents = "auto";
            }
        }
    </script>
</body>
</html>
